<!DOCTYPE html>
<html lang="de" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1e1b4b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Jeopardy">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%234338ca'/%3E%3Ctext x='32' y='46' font-family='Arial' font-weight='900' font-size='40' text-anchor='middle' fill='%23fbbf24'%3EJ%3C/text%3E%3C/svg%3E">
<title>Klassenraum-Jeopardy</title>
<style>
/* ============ Farben & Grundwerte ============ */
:root{
  --bg:#e9eef5; --surface:#ffffff; --surface-2:#eef2f7; --surface-3:#e2e8f0;
  --text:#0f172a; --muted:#475569; --line:#cbd5e1;
  --primary:#4338ca; --primary-2:#3730a3;
  --ok:#15803d; --ok-soft:#dcfce7; --bad:#b91c1c; --bad-soft:#fee2e2;
  --gold:#f59e0b; --focus:#f59e0b;
  --shadow:0 4px 14px rgba(15,23,42,.10); --shadow-lg:0 24px 70px rgba(15,23,42,.35);
  --overlay:rgba(15,23,42,.62);
  --font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans",sans-serif;
}
html[data-theme="dark"]{
  --bg:#0b1120; --surface:#151d31; --surface-2:#1d2740; --surface-3:#26324f;
  --text:#f1f5f9; --muted:#a3b1c6; --line:#334155;
  --primary:#6366f1; --primary-2:#4f46e5;
  --ok:#22c55e; --ok-soft:#123a24; --bad:#f87171; --bad-soft:#4a1d1d;
  --shadow:0 4px 14px rgba(0,0,0,.45); --overlay:rgba(2,6,23,.78);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:var(--font);background:var(--bg);color:var(--text);overflow:hidden;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased;line-height:1.35}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:disabled,[aria-disabled="true"]{cursor:not-allowed}
input,select,textarea{font:inherit;color:inherit}
:focus{outline:none}
:focus-visible{outline:4px solid var(--focus);outline-offset:2px}
#app{height:100%;display:flex;flex-direction:column}
.muted{color:var(--muted)} .small{font-size:.9rem} .center{text-align:center}
kbd{display:inline-block;font:700 .72em/1 var(--font);padding:.25em .45em;border-radius:6px;background:rgba(0,0,0,.14);margin-left:.4em;vertical-align:middle}
@media (hover:none){kbd{display:none}}

/* ============ Buttons ============ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.45em;padding:.65em 1.1em;border-radius:12px;font-weight:700;background:var(--surface-2);border:2px solid transparent;transition:transform .12s, filter .12s, background .12s;user-select:none;-webkit-user-select:none;line-height:1.15;text-align:center}
.btn:active:not(:disabled){transform:scale(.97)}
.btn:disabled{opacity:.4}
.btn-primary{background:var(--primary);color:#fff}
.btn-ok{background:var(--ok);color:#fff}
.btn-bad{background:var(--bad);color:#fff}
.btn-ok-soft{background:var(--ok-soft);color:var(--ok)}
.btn-bad-soft{background:var(--bad-soft);color:var(--bad)}
.btn-ghost{background:transparent;border-color:var(--line)}
.btn-bad-ghost{background:transparent;border-color:var(--bad-soft);color:var(--bad)}
.btn-sm{padding:.4em .7em;font-size:.9rem;border-radius:10px}
.btn-lg{padding:.8em 1.3em;font-size:1.15rem}
.btn-xl{padding:.85em 1.6em;font-size:clamp(1.1rem,1.6vw,1.6rem);border-radius:16px}
.btn-col{flex-direction:column;gap:.15em}.btn-col small{font-weight:600;opacity:.8}
.icon-btn{width:2.6rem;height:2.6rem;padding:0;font-size:1.2rem;border-radius:12px;background:var(--surface-2)}
@media (hover:hover){
  .btn:hover:not(:disabled){filter:brightness(1.08)}
  .btn-ghost:hover:not(:disabled){background:var(--surface-2)}
}
.pill{display:inline-block;padding:.15em .6em;border-radius:99px;background:var(--surface-3);font-weight:800;font-size:.85em}
.pill.gold{background:#fbbf24;color:#422006}

/* ============ Menü ============ */
.menu{flex:1;display:flex;padding:24px;overflow:auto;background:radial-gradient(ellipse at top,var(--surface) 0%,var(--bg) 70%)}
.menu-inner{margin:auto;width:min(760px,100%);display:flex;flex-direction:column;gap:18px;align-items:stretch;text-align:center}
.logo{margin:0;font-size:clamp(3.5rem,11vw,8rem);font-weight:900;letter-spacing:-.02em;line-height:1;background:linear-gradient(90deg,#e11d48,#f59e0b,#0ea5e9,#7c3aed);-webkit-background-clip:text;background-clip:text;color:transparent}
.menu-title{font-size:1.3rem;font-weight:700;color:var(--muted);margin-top:-6px}
.menu-label{font-size:.8rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:8px}
.menu-modes{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.mode-btn{flex-direction:column;padding:1.2em;border-radius:20px;color:#fff;font-size:1.5rem;box-shadow:var(--shadow)}
.mode-btn small{font-size:.9rem;font-weight:600;opacity:.8}
.mode-classic{background:#0f172a}
html[data-theme="dark"] .mode-classic{background:#334155}
.mode-trick{background:linear-gradient(135deg,#6d28d9,#ea580c)}
.btn-continue{flex-direction:column;background:var(--ok);color:#fff;font-size:1.6rem;padding:1em;border-radius:20px;box-shadow:var(--shadow)}
.btn-continue small{font-size:.95rem;font-weight:600;opacity:.9}
.menu-sub{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.menu-sub .btn{flex:1;min-width:150px;padding:1em}
@media (max-width:560px){.menu-modes{grid-template-columns:1fr}}

/* ============ Spiel-Kopf & Punktestand ============ */
.topbar{display:flex;align-items:center;gap:8px;padding:6px 10px;background:var(--surface);border-bottom:1px solid var(--line)}
.topbar .title{flex:1;min-width:0;text-align:center;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:1.05rem}
.topbar .title .pill{margin-left:.5em}
.topbar .tools{display:flex;gap:6px;align-items:center}
.scorebar{display:flex;gap:clamp(4px,.8vw,12px);padding:clamp(4px,.8vw,10px);background:var(--surface-2);border-bottom:1px solid var(--line)}
.team{position:relative;flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;padding:.35em .5em .4em;border-radius:14px;background:var(--surface);border:3px solid transparent;box-shadow:var(--shadow);overflow:visible;transition:background .2s,border-color .2s}
.team::before{content:"";position:absolute;left:0;right:0;top:0;height:7px;border-radius:11px 11px 0 0;background:var(--tc)}
.team .tname{font-weight:800;font-size:clamp(14px,1.55vw,28px);max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:4px}
.team .tscore{font-weight:900;font-size:clamp(26px,3.6vw,64px);line-height:1;font-variant-numeric:tabular-nums}
.team .tscore.neg{color:var(--bad)}
.team.active{border-color:var(--tc);background:var(--ts)}
.team .turn{position:absolute;top:-2px;right:6px;font-size:clamp(10px,.9vw,14px);font-weight:900;background:var(--tc);color:#fff;padding:.1em .5em;border-radius:0 0 8px 8px;letter-spacing:.04em}
.team.flash-pos{animation:flashPos .9s}
.team.flash-neg{animation:flashNeg .9s}
@keyframes flashPos{30%{box-shadow:0 0 0 6px rgba(34,197,94,.55)}}
@keyframes flashNeg{30%{box-shadow:0 0 0 6px rgba(239,68,68,.55)}}
.float{position:absolute;left:50%;top:30%;transform:translateX(-50%);font-weight:900;font-size:clamp(24px,3vw,48px);pointer-events:none;animation:floatUp 1.6s cubic-bezier(.22,1,.36,1) forwards;z-index:5;text-shadow:0 3px 8px rgba(0,0,0,.25)}
.float.pos{color:#16a34a}.float.neg{color:#dc2626}
@keyframes floatUp{0%{opacity:0;transform:translate(-50%,10px) scale(.6)}20%{opacity:1;transform:translate(-50%,-10px) scale(1.15)}100%{opacity:0;transform:translate(-50%,-70px) scale(1)}}

/* ============ Spielfeld ============ */
.board-wrap{flex:1;min-height:0;min-width:0;padding:clamp(4px,1vw,14px);position:relative}
.board{display:grid;width:100%;height:100%;gap:var(--gap,8px)}
.board > *{min-width:0;min-height:0}
.cat{display:flex;align-items:center;justify-content:center;text-align:center;background:var(--cd);color:#fff;border-radius:var(--rad,12px);padding:4px 6px;font-weight:800;font-size:var(--cfs,18px);line-height:1.1;overflow:hidden;overflow-wrap:anywhere;hyphens:auto}
.cat > span{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:var(--clines,3);overflow:hidden}
.tile{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:var(--rad,12px);background:var(--cc);color:#fff;font-weight:900;font-size:var(--vfs,40px);line-height:1;font-variant-numeric:tabular-nums;text-shadow:0 2px 0 rgba(0,0,0,.2);box-shadow:inset 0 -6px 0 rgba(0,0,0,.18),var(--shadow);transition:transform .15s,filter .15s;overflow:hidden}
.tile::after{content:"";position:absolute;inset:0;background:linear-gradient(160deg,rgba(255,255,255,.22),rgba(255,255,255,0) 55%);pointer-events:none}
.tile.done{background:var(--surface-2);box-shadow:none;border:2px dashed var(--line);color:var(--muted);text-shadow:none;font-size:var(--cfs,18px);font-weight:800;cursor:default}
.tile.done::after{display:none}
.tile.won{background:var(--ts);border:3px solid var(--tc);color:var(--text)}
.tile.won .owner{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;padding:0 4px;overflow-wrap:anywhere}
.tile .ticon{font-size:1.2em;margin-bottom:.15em}
.tile.empty{background:repeating-linear-gradient(45deg,var(--surface-2),var(--surface-2) 8px,var(--surface-3) 8px,var(--surface-3) 16px);color:var(--muted);box-shadow:none;text-shadow:none;font-size:var(--cfs,16px);font-weight:700;cursor:default}
.tile.empty::after{display:none}
@media (hover:hover){.tile:not(.done):not(.empty):hover{transform:translateY(-2px) scale(1.015);filter:brightness(1.08)}}
.tile:not(.done):not(.empty):active{transform:scale(.97)}
.final-banner{position:absolute;inset:auto 0 18px 0;display:flex;justify-content:center;pointer-events:none}
.final-banner .btn{pointer-events:auto;box-shadow:var(--shadow-lg)}

/* ============ Overlays & Modal ============ */
.overlay{position:fixed;inset:0;overflow:auto;background:var(--overlay);-webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px);display:flex;padding:clamp(8px,2vw,28px);z-index:50;animation:fadeIn .18s}
@keyframes fadeIn{from{opacity:0}}
.modal{margin:auto;position:relative;background:var(--surface);border-radius:24px;width:min(1500px,100%);max-height:100%;overflow:auto;box-shadow:var(--shadow-lg);border-top:14px solid var(--cc,var(--primary))}
.q-overlay{animation:none}.q-overlay.anim{animation:fadeIn .18s}.q-overlay.anim .modal{animation:pop .28s cubic-bezier(.34,1.56,.64,1)}
@keyframes pop{from{transform:scale(.92);opacity:0}}
.modal:focus,.modal:focus-visible{outline:none}
.modal-body{padding:clamp(16px,3vw,44px);display:flex;flex-direction:column;gap:clamp(10px,1.6vw,22px);min-height:min(56vh,640px);justify-content:center}
.modal .close{position:absolute;top:10px;right:12px;z-index:2}
.q-meta{text-align:center;font-weight:800;color:var(--cd,var(--muted));font-size:clamp(1rem,1.5vw,1.5rem);letter-spacing:.02em}
html[data-theme="dark"] .q-meta{color:var(--muted)}
.q-text{text-align:center;font-weight:800;font-size:clamp(1.6rem,3.6vw,3.8rem);line-height:1.2;overflow-wrap:anywhere}
.q-small{text-align:center;font-weight:700;font-size:clamp(1rem,1.7vw,1.6rem);color:var(--muted)}
.q-img{display:block;margin:0 auto;max-width:100%;max-height:42vh;object-fit:contain;border-radius:12px;background:#fff}
.sol-label{text-align:center;font-weight:800;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-size:.9rem}
.sol{text-align:center;font-weight:900;font-size:clamp(1.8rem,4.6vw,4.6rem);line-height:1.15;color:var(--cd,var(--text));overflow-wrap:anywhere}
html[data-theme="dark"] .sol{color:var(--text)}
.step-title{text-align:center;font-weight:900;font-size:clamp(1.3rem,2.4vw,2.4rem)}
.banner{background:var(--surface-2);border-left:6px solid var(--gold);padding:.7em 1em;border-radius:10px;font-weight:700;text-align:center;font-size:clamp(1rem,1.4vw,1.35rem)}
.banner.warn{border-left-color:var(--gold);text-align:left}
.actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:auto}
.actions.center{justify-content:center}
.ok-head,.res-head{text-align:center;font-weight:900;font-size:clamp(1.6rem,3vw,3rem)}
.res-head.ok,.ok-head{color:var(--ok)} .res-head.bad{color:var(--bad)} .res-head.neutral{color:var(--muted)}

/* Bewertung */
.judge-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:10px}
.judge{display:grid;grid-template-columns:1fr 1fr;border-radius:14px;overflow:hidden;border:3px solid var(--tc);background:var(--surface)}
.judge .jname{grid-column:1 / -1;min-width:0;display:flex;align-items:center;justify-content:center;gap:.3em;padding:.35em .6em;font-weight:800;font-size:clamp(1rem,1.5vw,1.45rem);background:var(--tc);color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.judge .jname kbd{margin:0 .3em 0 0;background:rgba(255,255,255,.25)}
.jbtn{height:clamp(48px,6vh,70px);font-size:clamp(1.5rem,2.4vw,2.2rem);font-weight:900}
.jbtn.ok{background:var(--ok-soft);color:var(--ok)}
.jbtn.bad{background:var(--bad-soft);color:var(--bad);border-left:2px solid var(--surface)}
.judge.off{opacity:.35}
.judge.off .jname{text-decoration:line-through}
@media (hover:hover){.jbtn.ok:hover:not(:disabled){background:var(--ok);color:#fff}.jbtn.bad:hover:not(:disabled){background:var(--bad);color:#fff}}
.solo{display:flex;flex-direction:column;align-items:center;gap:12px}
.solo-name{font-weight:900;font-size:clamp(1.3rem,2.4vw,2.4rem);padding:.25em .9em;border-radius:14px;background:var(--tc);color:#fff}
.solo-btns{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.solo-btns .btn{min-width:min(240px,40vw)}

/* Teamauswahl */
.team-pick{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:10px}
.team-pick .btn{background:var(--tc);color:#fff;font-size:clamp(1.1rem,1.8vw,1.7rem);padding:.8em .6em;flex-direction:column;border-radius:16px}
.team-pick .btn small{font-size:.65em;opacity:.85;font-weight:700}
.team-tag{display:inline-block;padding:.1em .55em;border-radius:10px;background:var(--tc);color:#fff;font-weight:800}
.team-tag.big{font-size:1.25rem;padding:.3em .8em}
.chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.chip{display:flex;align-items:center;gap:.6em;padding:.45em .9em;border-radius:14px;background:var(--surface-2);border:3px solid var(--tc);font-weight:800;font-size:clamp(1rem,1.6vw,1.6rem)}
.chip-delta.pos{color:var(--ok)} .chip-delta.neg{color:var(--bad)}
.chip-total{color:var(--muted);font-weight:700}
.next-info{text-align:center;font-weight:700;color:var(--muted);font-size:clamp(1rem,1.3vw,1.3rem)}

/* Splash / Enthüllung */
.splash{text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.splash-title{font-weight:900;font-size:clamp(3rem,10vw,9rem);line-height:1;letter-spacing:-.02em;animation:pop .5s cubic-bezier(.34,1.56,.64,1)}
.splash-title.small{font-size:clamp(1.6rem,3.5vw,3rem)}
.splash-sub{font-weight:800;font-size:clamp(1.1rem,2.2vw,2.2rem);color:var(--muted)}
.splash-text{font-weight:700;font-size:clamp(1.1rem,2vw,2rem)}
.sp-dd{background:linear-gradient(90deg,#f59e0b,#fde047,#f59e0b);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 #b45309)}
.sp-joker{background:linear-gradient(124deg,#ef4444,#f59e0b,#eab308,#22c55e,#06b6d4,#6366f1,#d946ef);background-size:400% 400%;animation:rainbow 5s ease infinite,pop .5s cubic-bezier(.34,1.56,.64,1);-webkit-background-clip:text;background-clip:text;color:transparent}
@keyframes rainbow{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.sp-double{color:#7c3aed}.sp-swap{color:#0891b2}.sp-bomb{color:#dc2626}.sp-final{color:var(--primary)}
.reveal{text-align:center;font-weight:900;font-size:clamp(5rem,16vw,13rem);line-height:1;animation:pop .6s cubic-bezier(.34,1.56,.64,1)}
.reveal.pos{color:#16a34a}.reveal.neg{color:#dc2626}

/* Einsatz */
.wager-quick{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.wager-custom{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.input{background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:.6em .8em;min-width:0}
.input:focus{border-color:var(--primary)}
.wager-custom .input{width:12em;font-size:1.2rem;text-align:center}

/* Countdown */
.timer{display:flex;align-items:center;gap:12px}
.timer-bar{flex:1;height:clamp(12px,1.4vw,20px);background:var(--surface-3);border-radius:99px;overflow:hidden}
.timer-fill{height:100%;width:100%;background:var(--ok);transform-origin:left center;transition:background .3s}
.timer-num{min-width:2.2em;text-align:right;font-weight:900;font-size:clamp(1.4rem,2.6vw,2.6rem);font-variant-numeric:tabular-nums}
.timer.warn .timer-fill{background:var(--gold)}
.timer.warn .timer-num{color:#d97706}
.timer.done .timer-fill{background:var(--bad)}
.timer.done .timer-num{color:var(--bad);animation:blink .5s 4}
@keyframes blink{50%{opacity:.2}}

/* ============ Bühne (Finale, Siegerehrung, Auslosung) ============ */
.stage{flex:1;min-height:0;overflow:auto;display:flex;padding:clamp(8px,2vw,28px)}
.stage-card{margin:auto;background:var(--surface);border-radius:24px;box-shadow:var(--shadow-lg);width:min(1100px,100%);padding:clamp(16px,3vw,44px);display:flex;flex-direction:column;gap:18px;border-top:14px solid var(--primary)}
.final-cat{font-weight:900;font-size:clamp(2rem,5vw,4.5rem);text-align:center}
.f-table{display:flex;flex-direction:column;gap:10px}
.f-row{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) minmax(0,1.2fr);gap:12px;align-items:center;padding:.6em .8em;border-radius:14px;background:var(--surface-2);border-left:10px solid var(--tc);font-size:clamp(1rem,1.6vw,1.5rem)}
.f-row .fname{font-weight:900;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.f-row .input{font-size:1.2rem;text-align:center;width:100%}
.f-row.err .input{border-color:var(--bad);background:var(--bad-soft)}
.f-marks{display:flex;gap:8px;justify-content:flex-end}
.f-marks .btn{min-width:4.5em}
.f-marks .btn.sel-ok{background:var(--ok);color:#fff}
.f-marks .btn.sel-bad{background:var(--bad);color:#fff}
.f-res{text-align:right;font-weight:900}
.f-res.pos{color:var(--ok)} .f-res.neg{color:var(--bad)}
.roulette{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;background:var(--overlay);z-index:20}
.roulette h2{margin:0;color:#fff;font-size:clamp(2rem,6vw,5rem);font-weight:900;text-transform:uppercase;letter-spacing:.08em}
.roul-name{min-width:min(80vw,520px);text-align:center;padding:.4em .8em;border-radius:24px;background:#334155;color:#fff;font-weight:900;font-size:clamp(2.5rem,8vw,6.5rem);transition:background .15s,transform .3s;box-shadow:var(--shadow-lg)}
.roul-name.win{transform:scale(1.12)}
.podium-view{flex:1;overflow:auto;display:flex;flex-direction:column;align-items:center;gap:20px;padding:20px}
.podium-view > :first-child{margin-top:auto}.podium-view > :last-child{margin-bottom:auto}
.podium-title{margin:0;font-size:clamp(2.2rem,6vw,5rem);font-weight:900}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:clamp(8px,2vw,24px);width:min(1000px,100%);height:min(52vh,460px)}
.pod{flex:1;max-width:300px;display:flex;flex-direction:column;align-items:center;height:100%;justify-content:flex-end;animation:rise .9s cubic-bezier(.22,1,.36,1) backwards}

.editor{flex:1;display:flex;flex-direction:column;min-height:0}

.ed-warn{font-size:.7rem;font-weight:800;color:var(--bad)}
.ed-img{position:absolute;top:4px;right:6px;font-size:.9rem}
.ed-foot{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:14px;max-width:1400px;margin:0 auto}

.thumb{max-height:80px;max-width:160px;border-radius:8px;border:1px solid var(--line);background:#fff}
.qe-head{display:flex;justify-content:space-between;align-items:flex-start;border-left:10px solid var(--cc);padding-left:12px}
.qe-cat{font-weight:900;font-size:1.2rem}
.qe-val{font-weight:800;color:var(--muted)}
.prev-box{border:2px dashed var(--line);border-radius:12px;padding:12px;min-height:3em;display:flex;flex-direction:column;gap:8px;text-align:center}
.prev-box .pq{font-weight:800;font-size:1.25rem}
.prev-box .pa{font-weight:900;color:var(--primary)}
.prev-box img{max-width:100%;max-height:200px;object-fit:contain;margin:0 auto;background:#fff;border-radius:8px}
.qe-help{background:var(--surface-2);border-radius:12px;padding:8px 12px;font-size:.92rem}
.qe-help summary{font-weight:800;cursor:pointer}
.qe-help code{background:var(--surface-3);padding:.1em .35em;border-radius:6px}
.help-page{flex:1;overflow:auto;padding:clamp(12px,3vw,32px)}
.help-page .card{max-width:900px;margin:0 auto 16px}
.help-page h2{margin:0;font-size:1.6rem}
.help-page ul{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:6px}
.help-page p{margin:0}

/* ============ Zwei Bildschirme ============ */
body:not(.presenting) .teacher-only{display:none!important}

body.presenting .when-single{display:none!important}

<audio id="sound-wrong" src="falsch.mp3" preload="auto"></audio>

<script>
'use strict';
/* =====================================================================
   Klassenraum-Jeopardy · Version 4
   Eine einzige Datei, läuft ohne Internet (außer für Formeln beim
   allerersten Laden). Daten liegen im Browser (localStorage).
   ===================================================================== */

// ---------- Konstanten ----------
const LS_LIB = 'jeopardyLibraryV4', LS_SET = 'jeopardySettingsV4', LS_OLD = 'jeopardyDataV3';
const COL_COLORS = [
  {c:'#dc2626', d:'#991b1b'}, {c:'#ea580c', d:'#9a3412'}, {c:'#16a34a', d:'#166534'}, {c:'#0284c7', d:'#075985'},
  {c:'#7c3aed', d:'#5b21b6'}, {c:'#db2777', d:'#9d174d'}, {c:'#0d9488', d:'#115e59'}, {c:'#4f46e5', d:'#3730a3'}
];
const TEAM_COLORS = ['#2563eb','#dc2626','#16a34a','#d97706','#9333ea','#0891b2','#db2777','#475569'];
const TYPES = {
  normal: {label:'Frage', icon:''},
  joker:  {label:'Joker', icon:'🃏'},
  double: {label:'Doppelt', icon:'×2'},
  swap:   {label:'Tausch', icon:'⇄'},
  bomb:   {label:'Bombe', icon:'💣'}
};
const TYPE_HELP = {
  normal: 'Normale Frage mit Lösung.',
  joker:  'Kein Quiz: Das Team bekommt die Punkte des Feldes geschenkt.',
  double: 'Normale Frage, die doppelt so viele Punkte wert ist.',
  swap:   'Kein Quiz: Das Team tauscht seinen Punktestand mit einem Team seiner Wahl.',
  bomb:   'Kein Quiz: Das Team verliert die Punkte des Feldes.'
};
const MAX_TEAMS = 8, MAX_COLS = 8, MAX_ROWS = 8;
const TIMER_PRESETS = [0, 10, 15, 20, 30, 45, 60, 90, 120];
const MATH_RE = /\$|\\\(|\\\[/;
// Zwei-Bildschirm-Modus: dieses Fenster ist entweder die Spielleitung oder das Beamer-Fenster (#beamer)
const DISPLAY = /^#beamer/.test(location.hash);
const IOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const BC = 'BroadcastChannel' in window ? new BroadcastChannel('klassenraum-jeopardy') : null;
const PRESENTER_OK = !!BC && !IOS && !DISPLAY;

// ---------- Hilfsfunktionen ----------
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const range = (a, b) => Array.from({length: b - a + 1}, (_, i) => a + i);
const fmt = n => { n = Number(n) || 0; return (n < 0 ? '−' : '') + Math.abs(n).toLocaleString('de-DE'); };
const signed = n => (n > 0 ? '+' : n < 0 ? '−' : '±') + fmt(Math.abs(n));
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function hexA(hex, a) { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`; }
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function strip(html) { const d = document.createElement('div'); d.innerHTML = sanitize(String(html || '')); return d.textContent.trim(); }
function hashPw(s) { let h = 0x811c9dc5; s = 'klassenraum-jeopardy:' + s; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 0x01000193) >>> 0; } return h.toString(16); }
function getPath(o, p) { return p.split('.').reduce((x, k) => x?.[k], o); }
function setPath(o, p, v) { const ks = p.split('.'); const last = ks.pop(); ks.reduce((x, k) => x[k], o)[last] = v; }
function fmtDate(t) { try { return new Date(t).toLocaleDateString('de-DE', {day:'2-digit', month:'2-digit', year:'numeric'}); } catch (e) { return ''; } }
function safeSrc(s) { s = String(s || '').trim(); return /^(https?:|data:image\/)/i.test(s) ? s : ''; }
function teamStyle(t) { return `--tc:${t.color};--ts:${hexA(t.color, .16)}`; }
const colColor = i => COL_COLORS[i % COL_COLORS.length];

// Nur harmlose HTML-Formatierung zulassen (Schutz vor Skripten in importierten Dateien)
const ALLOWED_TAGS = new Set(['B','STRONG','I','EM','U','S','BR','SUB','SUP','SPAN','P','DIV','SMALL','MARK','UL','OL','LI','IMG','CODE']);
const DROP_TAGS = new Set(['SCRIPT','STYLE','IFRAME','OBJECT','EMBED','LINK','META','TEMPLATE','SVG','MATH','FORM','INPUT','TEXTAREA','BUTTON','SELECT']);
function sanitize(html) {
  const tpl = document.createElement('template');
  tpl.innerHTML = html;
  const walk = node => {
    [...node.childNodes].forEach(ch => {
      if (ch.nodeType === 1) {
        if (DROP_TAGS.has(ch.tagName)) { ch.remove(); return; }
        walk(ch);
        if (!ALLOWED_TAGS.has(ch.tagName)) { ch.replaceWith(...ch.childNodes); return; }
        [...ch.attributes].forEach(at => {
          const n = at.name.toLowerCase();
          if (ch.tagName === 'IMG' && (n === 'src' || n === 'alt')) {
            if (n === 'src' && !safeSrc(at.value)) ch.removeAttribute('src');
          } else ch.removeAttribute(at.name);
        });
      } else if (ch.nodeType !== 3) ch.remove();
    });
  };
  walk(tpl.content);
  return tpl.innerHTML;
}
function rich(s) { return s ? sanitize(String(s).replace(/\r?\n/g, '<br>')) : ''; }

// ---------- Datenmodell ----------
function defaultConfig(cols = 5, rows = 5) {
  return {
    cols, rows,
    values: Array.from({length: rows}, (_, i) => (i + 1) * 100),
    deductOnWrong: true, allowThreeStrikes: false, enforceOrder: false, allowSteal: false,
    timer: {seconds: 0, autostart: true, sound: true},
    dailyDouble: {enabled: false, count: 1},
    final: {enabled: false, category: '', question: '', answer: '', image: '', seconds: 60}
  };
}
function freshSession() {
  return {started: false, finished: false, mode: 'classic', activeTeam: null, progress: {}, signs: {}, dd: [], scores: {}, history: [], final: null};
}
function newGame(title = 'Neues Spiel', cols = 5, rows = 5) {
  const g = {
    id: uid(), title, updatedAt: Date.now(), config: defaultConfig(cols, rows),
    categories: Array.from({length: cols}, (_, i) => `Kategorie ${i + 1}`),
    teams: Array.from({length: 4}, (_, i) => ({id: uid(), name: `Team ${i + 1}`, color: TEAM_COLORS[i]})),
    questions: [], session: freshSession()
  };
  return normalizeGame(g);
}
function normalizeGame(g) {
  const d = defaultConfig();
  g.id = g.id || uid();
  g.title = String(g.title || 'Unbenanntes Spiel');
  g.updatedAt = Number(g.updatedAt) || Date.now();
  const c = g.config = Object.assign({}, d, g.config || {});
  c.cols = clamp(parseInt(c.cols) || 5, 2, MAX_COLS);
  c.rows = clamp(parseInt(c.rows) || 5, 2, MAX_ROWS);
  c.timer = Object.assign({}, d.timer, c.timer || {});
  c.timer.seconds = clamp(parseInt(c.timer.seconds) || 0, 0, 600);
  c.dailyDouble = Object.assign({}, d.dailyDouble, c.dailyDouble || {});
  c.dailyDouble.count = clamp(parseInt(c.dailyDouble.count) || 1, 1, 3);
  c.final = Object.assign({}, d.final, c.final || {});
  ['deductOnWrong','allowThreeStrikes','enforceOrder','allowSteal'].forEach(k => c[k] = !!c[k]);
  if (!Array.isArray(c.values)) c.values = [];
  for (let r = 0; r < c.rows; r++) {
    const v = parseInt(c.values[r]);
    c.values[r] = Number.isFinite(v) && v > 0 ? v : (r > 0 ? c.values[r - 1] + (c.values[0] || 100) : 100);
  }
  c.values.length = c.rows;
  g.categories = Array.from({length: c.cols}, (_, i) => String((g.categories || [])[i] ?? `Kategorie ${i + 1}`));
  if (!Array.isArray(g.teams) || !g.teams.length) g.teams = [{name: 'Team 1'}, {name: 'Team 2'}];
  g.teams = g.teams.slice(0, MAX_TEAMS).map((t, i) => ({
    id: t.id || uid(), name: String(t.name ?? `Team ${i + 1}`),
    color: TEAM_COLORS.includes(t.color) ? t.color : TEAM_COLORS[i % TEAM_COLORS.length]
  }));
  const old = Array.isArray(g.questions) ? g.questions : [];
  const qs = [];
  for (let r = 0; r < c.rows; r++) for (let col = 0; col < c.cols; col++) {
    const e = old.find(q => +q.row === r && +q.col === col);
    qs.push({
      id: `q_${r}_${col}`, row: r, col,
      type: e && TYPES[e.type] ? e.type : 'normal',
      question: String(e?.question || ''), answer: String(e?.answer || ''), image: String(e?.image || '')
    });
  }
  g.questions = qs;
  const s = g.session = Object.assign(freshSession(), g.session || {});
  ['progress', 'signs', 'scores'].forEach(k => { if (!s[k] || typeof s[k] !== 'object' || Array.isArray(s[k])) s[k] = {}; });
  if (!Array.isArray(s.dd)) s.dd = [];
  if (!Array.isArray(s.history)) s.history = [];
  if (s.mode !== 'trick') s.mode = 'classic';
  if (s.activeTeam && !g.teams.some(t => t.id === s.activeTeam)) s.activeTeam = null;
  g.teams.forEach(t => { if (typeof s.scores[t.id] !== 'number') s.scores[t.id] = 0; });
  return g;
}
// Alte Spielstände (Version 3) übernehmen
function fromV3(raw, title) {
  const d = raw && raw.gameData ? raw.gameData : raw;
  if (!d || typeof d !== 'object' || !Array.isArray(d.questions)) throw new Error('Keine Spieldaten');
  const g = newGame(title || 'Importiertes Spiel', +d.config?.cols || 5, +d.config?.rows || 5);
  g.config.deductOnWrong = d.config?.deductOnWrong !== false;
  g.config.allowThreeStrikes = !!d.config?.allowThreeStrikes;
  g.config.enforceOrder = !!d.config?.enforceOrder;
  g.categories = Array.isArray(d.categories) ? d.categories.slice() : g.categories;
  const named = (d.teams || []).filter(t => t && String(t.name || '').trim());

let actx = null;
function audioCtx() {
  try {
    if (!actx) { const C = window.AudioContext || window.webkitAudioContext; if (!C) return null; actx = new C(); }
    if (actx.state === 'suspended') actx.resume();
  } catch (e) { return null; }

}
function tone(freq, dur, {type = 'sine', vol = .2, at = 0, slide = null} = {}) {
  const a = audioCtx(); if (!a) return;
  const t0 = a.currentTime + at;
  const o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t0);
  if (slide) o.frequency.exponentialRampToValueAtTime(slide, t0 + dur);
  g.gain.setValueAtTime(.0001, t0);
  g.gain.exponentialRampToValueAtTime(vol, t0 + .015);
  g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
  o.connect(g); g.connect(a.destination);
  o.start(t0); o.stop(t0 + dur + .05);
}
const SYNTH = {
  correct: () => { tone(660, .15, {type: 'triangle'}); tone(990, .25, {type: 'triangle', at: .12}); },
  wrong:   () => { tone(220, .4, {type: 'sawtooth', vol: .12, slide: 110}); },
  tick:    () => tone(1100, .05, {type: 'square', vol: .05}),
  buzzer:  () => { tone(140, .8, {type: 'sawtooth', vol: .16}); tone(146, .8, {type: 'square', vol: .06}); },
  pop:     () => tone(420, .14, {type: 'triangle', vol: .2, slide: 900}),
  dd:      () => [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, .18, {type: 'triangle', at: i * .08, vol: .16})),
  fanfare: () => {
    [[523, 0], [659, .16], [784, .32], [1047, .5]].forEach(([f, t]) => tone(f, .3, {type: 'triangle', at: t, vol: .2}));
    [523, 659, 784, 1047].forEach(f => tone(f, 1.2, {type: 'triangle', at: .85, vol: .1}));
  }
};
function sfx(name) {
  if (!name || settings.muted) return;
  if (name === 'correct' || name === 'wrong') {
    const el = document.getElementById('sound-' + name);
    if (el && !el.error) {
      try { el.currentTime = 0; const p = el.play(); if (p) p.catch(() => SYNTH[name]()); return; } catch (e) {}
    }

}

// ---------- Countdown ----------
const T = {total: 0, left: 0, running: false, last: 0, raf: 0, beep: null, done: false};
function timerSetup(seconds, auto) {
  stopTimer();
  T.total = seconds || 0; T.left = T.total; T.done = false; T.beep = null;
  if (T.total > 0 && auto) startTimer();
}
function startTimer() {
  if (T.total <= 0 || T.running) return;
  if (T.left <= 0) { T.left = T.total; T.done = false; T.beep = null; }
  T.running = true; T.last = performance.now(); loopTimer(); updateTimerUI(); syncTimer();
}
function pauseTimer() { T.running = false; cancelAnimationFrame(T.raf); updateTimerUI(); syncTimer(); }
function stopTimer() { T.running = false; cancelAnimationFrame(T.raf); }
function resetTimer() { stopTimer(); T.left = T.total; T.done = false; T.beep = null; updateTimerUI(); syncTimer(); }
function toggleTimer() { T.running ? pauseTimer() : startTimer(); }
function loopTimer() {
  T.raf = requestAnimationFrame(() => {
    if (!T.running) return;
    const now = performance.now();
    T.left = Math.max(0, T.left - (now - T.last) / 1000); T.last = now;
    const sec = Math.ceil(T.left);
    if (G.config.timer.sound && sec <= 5 && sec > 0 && sec !== T.beep) { T.beep = sec; sfx('tick'); }
    if (T.left <= 0) { T.running = false; T.done = true; sfx('buzzer'); updateTimerUI(); syncTimer(); return; }
    updateTimerUI(); loopTimer();
  });
}
function timerHTML() {
  return `<div id="timer" class="timer" aria-label="Countdown">
    <div class="timer-bar"><div class="timer-fill"></div></div>
    <div class="timer-num">${Math.ceil(T.left)}</div>
    <button class="icon-btn" data-action="timerToggle" title="Start/Pause (T)">▶</button>
    <button class="icon-btn" data-action="timerReset" title="Zurücksetzen">↺</button>
  </div>`;
}
function updateTimerUI() {
  const el = $('#timer'); if (!el) return;
  const frac = T.total ? T.left / T.total : 0;
  el.querySelector('.timer-fill').style.transform = `scaleX(${frac})`;
  el.querySelector('.timer-num').textContent = Math.ceil(T.left);
  el.classList.toggle('warn', T.left <= 5 && T.left > 0);
  el.classList.toggle('done', T.done);
  el.querySelector('[data-action=timerToggle]').textContent = T.running ? '⏸' : '▶';
}

function fitBoard() {
  const grid = $('.board'); if (!grid) return;
  const cols = G.config.cols, rows = G.config.rows;
  const apply = () => {
    const r = grid.getBoundingClientRect(); if (!r.width || !r.height) return;
    const gap = clamp(Math.min(r.width / cols, r.height / (rows + 1)) * .06, 3, 12);
    const cw = (r.width - gap * (cols - 1)) / cols;
    const ch = (r.height - gap * rows) / (rows + .8);
    grid.style.setProperty('--gap', gap + 'px');
    grid.style.setProperty('--vfs', clamp(Math.min(cw * .27, ch * .5), 16, 110) + 'px');
    grid.style.setProperty('--cfs', clamp(Math.min(cw * .105, ch * .21), 11, 34) + 'px');
    grid.style.setProperty('--rad', clamp(Math.min(cw, ch) * .1, 6, 18) + 'px');
    grid.style.setProperty('--clines', ch < 50 ? 2 : ch < 85 ? 3 : 4);
  };
  apply();
  if (window.ResizeObserver) { gridRO = new ResizeObserver(apply); gridRO.observe(grid); }
  else window.onresize = () => { if (ui.view === 'game') apply(); };
}

  const step = t => {
    const k = Math.min(1, (t - start) / dur);
    const v = Math.round(a.from + (a.to - a.from) * (1 - Math.pow(1 - k, 3)));
    el.textContent = fmt(v);
    if (k < 1) requestAnimationFrame(step); else { el.textContent = fmt(a.to); el.classList.toggle('neg', a.to < 0); }
  };
  requestAnimationFrame(step);
  const f = document.createElement('div');

  f.textContent = signed(a.delta);
  card.appendChild(f); setTimeout(() => f.remove(), 1700);

const A = {}; // Aktionen (per data-action ausgelöst)

A.splashNext = () => {

  snapshot(`${t.name} richtig`);

function startDraw() {
  ui.drawing = true; render();

    const el = $('#roulette'); if (!el) return; el.textContent = t.name; el.style.background = t.color; el.classList.toggle('win', !!win);
  };
  const step = () => {
    if (!ui.drawing) return;

function confetti(dur = 4500) {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const cv = $('#confetti'), ctx = cv.getContext('2d'), dpr = window.devicePixelRatio || 1;
  cv.width = innerWidth * dpr; cv.height = innerHeight * dpr; cv.style.display = 'block';
  const colors = [...TEAM_COLORS, '#facc15', '#f472b6'];
  const ps = Array.from({length: 200}, () => ({x: Math.random() * cv.width, y: -Math.random() * cv.height * .6, vx: (Math.random() - .5) * 5 * dpr, vy: (2 + Math.random() * 4) * dpr, s: (7 + Math.random() * 9) * dpr, r: Math.random() * 6, vr: (Math.random() - .5) * .3, c: colors[Math.floor(Math.random() * colors.length)]}));
  const t0 = performance.now();
  const loop = t => {
    ctx.clearRect(0, 0, cv.width, cv.height);
    ps.forEach(p => { p.x += p.vx; p.y += p.vy; p.vy += .04 * dpr; p.vx *= .995; p.r += p.vr; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); ctx.restore(); });
    if (t - t0 < dur) requestAnimationFrame(loop); else { ctx.clearRect(0, 0, cv.width, cv.height); cv.style.display = 'none'; }
  };
  requestAnimationFrame(loop);
}

  dlg.onKey = e => {
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { A.qeSave(); return true; }

  const origClose = dlg.close;

// Bilder
function downscale(file, max = 1280) {
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => {
      const img = new Image();
      img.onload = () => {
        const k = Math.min(1, max / Math.max(img.width, img.height));
        const w = Math.max(1, Math.round(img.width * k)), h = Math.max(1, Math.round(img.height * k));
        const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
        const ctx = cv.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h); ctx.drawImage(img, 0, 0, w, h);
        res(cv.toDataURL('image/jpeg', .85));
      };
      img.onerror = rej; img.src = fr.result;
    };
    fr.onerror = rej; fr.readAsDataURL(file);
  });
}

  if (target === 'final') { G.config.final.image = src; saveLib(); render(); }
  else if (ui.qdraft) { ui.qdraft.draft.image = src; ui.qdraft.dirty = true; renderQE(); }

  applyImage(d.target, v);

  d.box.querySelector('[data-x=ok]').onclick = ok;
  d.box.querySelector('[data-x=c]').onclick = () => d.close();
  d.onKey = e => { if (e.key === 'Enter') { ok(); return true; } if (e.key === 'Escape') { d.close(); return true; } };
};
A.teamColor = d => { const t = teamById(d.id); t.color = d.c; saveLib(); render(); };
A.teamMove = d => {
  const i = G.teams.findIndex(t => t.id === d.id), j = i + parseInt(d.d, 10);
  if (j < 0 || j >= G.teams.length) return;
  [G.teams[i], G.teams[j]] = [G.teams[j], G.teams[i]]; saveLib(); render();
};
A.teamRemove = d => {
  const t = teamById(d.id); if (!t || G.teams.length <= 1) return;
  dialogConfirm(`„${esc(t.name)}“ entfernen?`, () => {
    const s = S();
    if (s.activeTeam === t.id) { const i = G.teams.indexOf(t); s.activeTeam = G.teams.length > 1 ? G.teams[(i + 1) % G.teams.length].id : null; }
    G.teams = G.teams.filter(x => x.id !== t.id);
    delete s.scores[t.id];
    saveLib(); render();
  }, {ok: 'Entfernen', danger: true});
};
A.teamAdd = () => {
  if (G.teams.length >= MAX_TEAMS) return;
  const used = G.teams.map(t => t.color);
  const color = TEAM_COLORS.find(c => !used.includes(c)) || TEAM_COLORS[G.teams.length % TEAM_COLORS.length];
  const t = {id: uid(), name: `Team ${G.teams.length + 1}`, color};
  G.teams.push(t); S().scores[t.id] = 0; saveLib(); render();
};
A.clearAll = () => {
  const d = openDialog(`<h3>Alle Fragen leeren?</h3><p>Möchtest du das Spiel vorher als Datei sichern?</p>
    <div class="dlg-actions stack"><button class="btn btn-ok" data-x="save">Sichern und dann leeren</button>
    <button class="btn btn-bad" data-x="clear">Ohne Sichern leeren</button><button class="btn btn-ghost" data-x="c">Abbrechen</button></div>`);
  const clear = () => {
    G.questions.forEach(q => { q.question = ''; q.answer = ''; q.image = ''; q.type = 'normal'; });
    G.session = freshSession(); normalizeGame(G); saveLib(); render(); toast('Alle Fragen wurden geleert.');
  };
  d.box.addEventListener('click', e => {
    const x = e.target.closest('[data-x]')?.dataset.x; if (!x) return;
    d.close();
    if (x === 'save') { exportGame(false); setTimeout(() => dialogConfirm('Die Datei wurde heruntergeladen. Jetzt wirklich alle Fragen löschen?', clear, {ok: 'Löschen', danger: true}), 300); }
    if (x === 'clear') dialogConfirm('Letzte Warnung: Alle Fragen und Lösungen dieses Spiels werden gelöscht.', clear, {ok: 'Löschen', danger: true});
  });
  d.onKey = e => { if (e.key === 'Escape') { d.close(); return true; } };
};
function resizeGrid(cols, rows) {
  const lost = G.questions.filter(q => (q.col >= cols || q.row >= rows) && (q.question.trim() || q.type !== 'normal' || q.image)).length;
  const lostCats = G.categories.slice(cols).filter((c, i) => c.trim() && c !== `Kategorie ${cols + i + 1}`).length;
  const doIt = () => { G.config.cols = cols; G.config.rows = rows; normalizeGame(G); saveLib(); render(); };
  if (lost || lostCats) dialogConfirm(`Beim Verkleinern gehen ${lost} ausgefüllte ${lost === 1 ? 'Frage' : 'Fragen'} verloren. Fortfahren?`, doIt, {ok: 'Verkleinern', danger: true, onCancel: render});
  else doIt();
}

// Bibliothek, Export, Import
A.library = () => openLibrary();
function openLibrary() {
  dialogs.filter(d => d.lib).forEach(d => d.close());
  const games = Object.values(library.games).sort((a, b) => b.updatedAt - a.updatedAt);
  let kb = 0; try { kb = Math.round((localStorage.getItem(LS_LIB) || '').length / 1024); } catch (e) {}
  const d = openDialog(`<h3>📚 Meine Spiele</h3><div class="lib-list">${games.map(g => `<div class="lib-item ${g.id === G.id ? 'cur' : ''}">
      <div class="lib-info"><b>${esc(g.title)}</b><small>${g.questions.filter(playable).length} Fragen · ${g.config.cols}×${g.config.rows} · geändert am ${fmtDate(g.updatedAt)}</small></div>
      <div class="lib-btns">${g.id === G.id ? '<span class="pill">geöffnet</span>' : `<button class="btn btn-sm btn-primary" data-action="libOpen" data-id="${g.id}">Öffnen</button>`}
        <button class="btn btn-sm" data-action="libDup" data-id="${g.id}">Kopie</button>
        <button class="btn btn-sm btn-bad-ghost" data-action="libDel" data-id="${g.id}" ${games.length <= 1 ? 'disabled' : ''}>Löschen</button></div></div>`).join('')}</div>
    <p class="muted small">Gespeichert im Browser dieses Geräts (${kb} KB belegt). Für andere Geräte: „Exportieren“.</p>
    <div class="dlg-actions spread"><button class="btn" data-action="libNew">+ Neues Spiel</button><button class="btn btn-primary" data-action="dlgClose">Schließen</button></div>`, {cls: 'dlg-wide'});
  d.lib = true;
  d.onKey = e => { if (e.key === 'Escape') { d.close(); return true; } };
}
function switchGame(id) { library.currentId = id; G = library.games[id]; persist(); }
A.libOpen = d => { switchGame(d.id); dialogs.filter(x => x.lib).forEach(x => x.close()); render(); toast(`„${G.title}“ geöffnet`, 'ok'); };
A.libDup = d => {
  const src = library.games[d.id]; const g = normalizeGame(JSON.parse(JSON.stringify(src)));
  g.id = uid(); g.title = src.title + ' (Kopie)'; g.session = freshSession(); g.teams.forEach(t => t.id = uid()); normalizeGame(g);
  library.games[g.id] = g;
  if (persist()) openLibrary(); else delete library.games[g.id];
};
A.libDel = d => {
  const g = library.games[d.id]; if (!g || Object.keys(library.games).length <= 1) return;
  dialogConfirm(`„${esc(g.title)}“ endgültig löschen? (Tipp: vorher exportieren)`, () => {
    delete library.games[d.id];
    if (G.id === d.id) switchGame(Object.keys(library.games)[0]);
    persist(); render(); openLibrary();
  }, {ok: 'Löschen', danger: true});
};
A.libNew = () => dialogPrompt('Neues Spiel', 'Name des Spiels', v => {
  if (!v) return 'Bitte einen Namen eingeben.';
  const g = newGame(v); library.games[g.id] = g; switchGame(g.id);
  dialogs.filter(x => x.lib).forEach(x => x.close());
  ui.etab = 'fragen'; render(); toast(`„${v}“ angelegt`, 'ok');
}, {placeholder: 'z. B. Säuren und Basen'});
A.exportDlg = () => {
  const d = openDialog(`<h3>💾 Exportieren</h3><p>Was soll in die Datei?</p>
    <div class="dlg-actions stack"><button class="btn btn-primary btn-col" data-x="0"><span>Nur die Fragen</span><small>Vorlage zum Weitergeben oder für ein anderes Gerät</small></button>
    <button class="btn btn-col" data-x="1"><span>Fragen mit Spielstand</span><small>Sicherung mitten im Spiel</small></button>
    <button class="btn btn-ghost" data-x="c">Abbrechen</button></div>`);
  d.box.addEventListener('click', e => { const x = e.target.closest('[data-x]')?.dataset.x; if (!x) return; d.close(); if (x !== 'c') exportGame(x === '1'); });
  d.onKey = e => { if (e.key === 'Escape') { d.close(); return true; } };
};
function exportGame(withProgress) {
  try {
    const g = JSON.parse(JSON.stringify(G));
    if (withProgress) g.session.history = []; else g.session = freshSession();
    const payload = {app: 'Klassenraum-Jeopardy', version: 4, exportedAt: new Date().toISOString(), game: g};
    const blob = new Blob([JSON.stringify(payload, null, 1)], {type: 'application/json'});
    const url = URL.createObjectURL(blob), a = document.createElement('a');
    const slug = (G.title || 'jeopardy').toLowerCase().replace(/[äöüß]/g, c => ({'ä': 'ae', 'ö': 'oe', 'ü': 'ue', 'ß': 'ss'}[c])).replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'jeopardy';
    a.href = url; a.download = `${slug}${withProgress ? '-spielstand' : ''}-${new Date().toISOString().slice(0, 10)}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
    toast('Datei wird heruntergeladen …', 'ok');
  } catch (e) { dialogAlert('Das Spiel konnte leider nicht exportiert werden.'); }
}
A.importClick = () => { const i = $('#importFile'); i.value = ''; i.click(); };
function importFile(file) {
  const fr = new FileReader();
  fr.onload = () => {
    try {
      const raw = JSON.parse(fr.result);
      let g;
      if (raw && raw.version >= 4 && raw.game) { g = normalizeGame(raw.game); g.id = uid(); }
      else g = fromV3(raw, file.name.replace(/\.json$/i, '').replace(/[-_]+/g, ' '));
      library.games[g.id] = g;
      const prev = library.currentId;
      switchGame(g.id);
      if (!persist()) { delete library.games[g.id]; switchGame(prev); return; }
      ui.etab = 'fragen'; render(); toast(`„${g.title}“ importiert und geöffnet`, 'ok', 3500);
    } catch (e) { dialogAlert('Die Datei konnte nicht importiert werden. Bitte wähle eine gültige Jeopardy-Datei (.json).'); }
  };
  fr.onerror = () => dialogAlert('Die Datei konnte nicht gelesen werden.');
  fr.readAsText(file);
}

// ---------- Eingaben im Editor (change) ----------
const C = {
  gameTitle: el => { G.title = el.value.trim() || 'Unbenanntes Spiel'; saveLib(); },
  cat: el => { G.categories[+el.dataset.i] = el.value; saveLib(); },
  cols: el => resizeGrid(parseInt(el.value, 10), G.config.rows),
  rows: el => resizeGrid(G.config.cols, parseInt(el.value, 10)),
  value: el => { const v = parseInt(el.value, 10); if (v > 0) G.config.values[+el.dataset.i] = v; saveLib(); render(); },
  cfg: el => {
    setPath(G.config, el.dataset.key, el.checked);
    if (el.dataset.key === 'enforceOrder' && el.checked && !S().activeTeam && S().started) toast('Beim Weiterspielen wird ausgelost, wer beginnt.');
    saveLib(); render();
  },
  timerSeconds: el => { G.config.timer.seconds = clamp(parseInt(el.value, 10) || 0, 0, 600); saveLib(); render(); },
  ddCount: el => { G.config.dailyDouble.count = parseInt(el.value, 10); saveLib(); },
  sound: el => { settings.muted = !el.checked; saveSettings(); },
  teamName: el => { const t = teamById(el.dataset.id); if (t) { t.name = el.value.trim() || 'Team'; saveLib(); } },
  finalField: el => { G.config.final[el.dataset.k] = el.value; saveLib(); if (el.dataset.k === 'question') render(); },
  finalSeconds: el => { G.config.final.seconds = parseInt(el.value, 10) || 0; saveLib(); }
};

// ---------- Ereignisse ----------
document.addEventListener('click', e => {
  if (DISPLAY) return;
  const el = e.target.closest('[data-action]');
  if (!el || el.disabled || el.getAttribute('aria-disabled') === 'true') return;
  const fn = A[el.dataset.action];
  if (fn) { audioCtx(); fn(el.dataset, el, e); }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.id === 'imgFile') {
    const f = el.files && el.files[0]; if (!f) return;
    downscale(f).then(src => applyImage(ui.imgTarget, src)).catch(() => dialogAlert('Das Bild konnte nicht geladen werden.'));
    return;
  }
  if (el.id === 'importFile') { const f = el.files && el.files[0]; if (f) importFile(f); return; }
  const fn = el.dataset && C[el.dataset.change];
  if (fn) fn(el);
});
document.addEventListener('pointerdown', () => { ui.kbd = false; }, true);

const digitOf = code => { const m = /^(?:Digit|Numpad)([1-8])$/.exec(code || ''); return m ? +m[1] : 0; };
const isPrimary = e => e.key === 'Enter' || e.key === ' ' || e.key === 'PageDown' || e.key === 'ArrowRight';
document.addEventListener('keydown', e => {
  if (DISPLAY) { if (/^[fv]$/i.test(e.key)) toggleFullscreen(); return; }
  if (dialogs.length) { const d = dialogs[dialogs.length - 1]; if (d.onKey && d.onKey(e)) e.preventDefault(); return; }
  const tag = e.target.tagName;
  const typing = tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || e.target.isContentEditable;
  if (typing) {
    if (e.key === 'Enter' && e.target.dataset.enter && A[e.target.dataset.enter]) { e.preventDefault(); A[e.target.dataset.enter](e.target.dataset); }
    return;
  }
  const inGame = ui.view === 'game' || ui.view === 'final';
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z' && inGame) { e.preventDefault(); undo(); return; }
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if (ui.view === 'podium' || ui.view === 'help') { if (e.key === 'Escape') A.toMenu(); return; }
  if (!inGame) return;
  if (k === 'm') { A.mute(); return; }
  if (k === 'v') { toggleFullscreen(); return; }
  if (e.key === '?' || k === 'h') { keysHelp(); return; }
  if (k === 'u') { undo(); return; }
  if (ui.drawing) return;
  if (ui.view === 'final') return finalKey(e);
  if (ui.modal) return modalKey(e);
  boardKey(e);
});
function modalKey(e) {
  const m = ui.modal, k = e.key.toLowerCase(), d = digitOf(e.code);
  const stop = () => e.preventDefault();
  if (e.key === 'Escape') { stop(); if (canPause(m)) A.pause(); else if (m.step === 'result' || m.step === 'reveal') A.next(); return; }
  if (m.step === 'splash' && isPrimary(e)) { stop(); return A.splashNext(); }
  if ((m.step === 'result' || m.step === 'reveal') && isPrimary(e)) { stop(); return A.next(); }
  if (m.step === 'question') {
    if (k === 't') { stop(); return toggleTimer(); }
    if (k === 'n' && m.kind !== 'dd') { stop(); return A.nobody(); }
    const solo = soloTeamId();
    if (solo && k === 'r') { stop(); return A.right({team: solo}); }
    if (solo && k === 'f') { stop(); return A.wrong({team: solo}); }
    if (d && G.teams[d - 1]) { stop(); const id = G.teams[d - 1].id; return e.shiftKey ? A.wrong({team: id}) : A.right({team: id}); }
  }
  if (['pickActor', 'pickPartner', 'target'].includes(m.step) && d && G.teams[d - 1]) {
    const id = G.teams[d - 1].id;
    if (m.step === 'pickPartner' && id === m.actor) return;
    stop(); return A[m.step]({team: id});
  }
}
function finalKey(e) {
  const f = S().final; if (!f) return;
  const d = digitOf(e.code);
  if (f.step === 'judge' && d && G.teams[d - 1]) { e.preventDefault(); return A.finalMark({team: G.teams[d - 1].id, v: e.shiftKey ? '0' : '1'}); }
  if (e.key === 't' || e.key === 'T') { if (f.step === 'question') { e.preventDefault(); toggleTimer(); } return; }
  if (isPrimary(e) && f.step !== 'wager') { const b = $('[data-action=finalNext]'); if (b && !b.disabled) { e.preventDefault(); A.finalNext(); } }
}
function boardKey(e) {
  const dirs = {ArrowLeft: [0, -1], ArrowRight: [0, 1], ArrowUp: [-1, 0], ArrowDown: [1, 0]};
  if (!dirs[e.key]) return;
  e.preventDefault(); ui.kbd = true;
  const cur = document.activeElement && document.activeElement.classList.contains('tile') ? document.activeElement : null;
  if (!cur) { const first = $('.tile[data-action=tile]') || $('.tile'); first && first.focus(); return; }
  let r = +cur.dataset.r, c = +cur.dataset.c;
  const [dr, dc] = dirs[e.key];
  for (let i = 0; i < 10; i++) {
    r += dr; c += dc;
    if (r < 0 || c < 0 || r >= G.config.rows || c >= G.config.cols) return;
    const t = $(`.tile[data-r="${r}"][data-c="${c}"]`);
    if (t && !t.classList.contains('empty')) { t.focus(); ui.focusTile = t.dataset.q; return; }
  }
}

// ---------- Zwei Bildschirme ----------
let lastPing = 0, displayWin = null;
const displayAlive = () => Date.now() - lastPing < 7000;
function updatePresenting() { document.body.classList.toggle('presenting', PRESENTER_OK && displayAlive() && window.screen.isExtended !== false); }
function timerState() { return {total: T.total, left: T.left, running: T.running, done: T.done, at: Date.now()}; }
function syncTimer() { if (!DISPLAY && BC && displayAlive()) try { BC.postMessage({type: 'timer', timer: timerState()}); } catch (e) {} }
function syncDisplay(anims = []) {
  if (DISPLAY || !BC || !displayAlive()) return;
  const msg = {type: 'state', view: ui.view, modal: ui.modal, drawing: ui.drawing, theme: settings.theme, anims, timer: timerState()};
  if (sentRev !== gameRev) { msg.game = Object.assign({}, G, {session: Object.assign({}, G.session, {history: []})}); sentRev = gameRev; }
  try { BC.postMessage(msg); } catch (e) {}
}
function applyTimer(t) {
  if (!t) return;
  stopTimer();
  T.total = t.total; T.done = t.done; T.beep = null;
  T.left = Math.max(0, t.left - (t.running ? (Date.now() - t.at) / 1000 : 0));
  if (t.running && T.left > 0) { T.running = true; T.last = performance.now(); loopTimer(); }
  updateTimerUI();
}
A.openDisplay = async () => {
  if (!PRESENTER_OK) return;
  const url = location.href.split('#')[0] + '#beamer';
  const w = window.open('', 'jeopardy-beamer', 'popup=yes,width=1280,height=720');
  if (!w) return dialogAlert('Der Browser hat das Beamer-Fenster blockiert. Bitte Pop-ups für diese Seite erlauben (Symbol rechts in der Adresszeile) und dann noch einmal auf 📺 tippen.', '📺 Beamer-Fenster');
  displayWin = w;
  let fresh = false;
  try { fresh = w.location.href === 'about:blank'; } catch (e) {}
  if (fresh) w.location.href = url;
  w.focus();
  // In Chrome/Edge: Fenster automatisch auf den zweiten Bildschirm schieben (fragt einmalig nach Erlaubnis)
  if (fresh) {
    try {
      if ('getScreenDetails' in window) {
        const sd = await window.getScreenDetails();
        const other = sd.screens.find(x => x !== sd.currentScreen);
        if (other) { w.moveTo(other.availLeft, other.availTop); w.resizeTo(other.availWidth, other.availHeight); }
      }
    } catch (e) {}
  }
  if (window.screen.isExtended === false)
    dialogAlert('Es wurde nur <b>ein</b> Bildschirm erkannt. Stelle die Anzeige auf <b>„Erweitern“</b> statt „Duplizieren“ (Windows: <kbd>Win</kbd> + <kbd>P</kbd>, Mac: Systemeinstellungen → Displays).<br><br>Solange der Bildschirm nur gespiegelt wird, blendet die App deine Lösungen zur Sicherheit nicht ein.', '📺 Zweiter Bildschirm');
  else if (fresh) toast('Beamer-Fenster geöffnet – dort einmal klicken für Vollbild.', 'ok', 4500);
};

// ---------- Start ----------
loadAll();
if (DISPLAY) {
  document.body.classList.add('display');
  document.title = 'Jeopardy – Beamer';
  settings.muted = true; // Töne spielt nur das Fenster der Spielleitung
  if (BC) {
    BC.onmessage = e => {
      const d = e.data || {};
      if (d.type === 'state') {
        if (d.game) G = normalizeGame(d.game);
        if (d.modal) d.modal.shown = !!(ui.modal && ui.modal.qid === d.modal.qid);
        const wasPodium = ui.view === 'podium';
        ui.modal = d.modal; ui.drawing = d.drawing; ui.view = d.view; ui.anim = d.anims || [];
        settings.theme = d.theme;
        applyTimer(d.timer);
        render();
        if (ui.view === 'podium' && !wasPodium) setTimeout(() => confetti(), 300);
      } else if (d.type === 'timer') applyTimer(d.timer);
      else if (d.type === 'roul') { const el = $('#roulette'); if (el) { el.textContent = d.name; el.style.background = d.color; el.classList.toggle('win', d.win); } }
      else if (d.type === 'ctrl-bye') { ui.view = 'menu'; ui.modal = null; stopTimer(); render(); }
    };
    BC.postMessage({type: 'hello'});
    setInterval(() => BC.postMessage({type: 'ping'}), 2000);
    window.addEventListener('pagehide', () => { try { BC.postMessage({type: 'bye'}); } catch (e) {} });
  }
  const hint = document.createElement('div');
  hint.id = 'fsHint';
  hint.innerHTML = '<div><b>📺 Beamer-Ansicht</b>Dieses Fenster auf den Beamer ziehen<br>und dann hier klicken – für Vollbild.<br><small class="muted">Später: Doppelklick oder Taste F schaltet Vollbild um.</small></div>';
  hint.addEventListener('click', () => { if (fsSupported()) toggleFullscreen(); hint.remove(); requestWake(); });
  document.body.appendChild(hint);
  document.addEventListener('dblclick', () => toggleFullscreen());
} else if (BC) {
  BC.onmessage = e => {
    const d = e.data || {};
    if (d.type === 'hello' || d.type === 'ping') {
      const was = displayAlive(); lastPing = Date.now();
      if (d.type === 'hello' || !was) { sentRev = -1; syncDisplay(); }
      updatePresenting();
    } else if (d.type === 'bye') { lastPing = 0; updatePresenting(); }
  };
  setInterval(updatePresenting, 2000);
  window.addEventListener('pagehide', () => { try { BC.postMessage({type: 'ctrl-bye'}); } catch (e) {} });
}
render();
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
