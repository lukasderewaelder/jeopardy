<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jeopardy</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- MathJax Configuration & Load -->
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: {
                fontCache: 'global'
            }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
            overflow: hidden; /* Wichtig: Kein Scrollen auf Body-Ebene */
            height: 100vh;
            width: 100vw;
        }

        /* Modern Flat Utility Classes */
        .flat-btn {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .flat-btn:active {
            transform: scale(0.96);
        }

        .modal-overlay {
            background-color: rgba(248, 250, 252, 0.9);
            backdrop-filter: blur(8px);
        }

        /* Animation classes */
        .scale-in {
            animation: scaleIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        @keyframes scaleIn {
            from { transform: scale(0.9); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        /* Score Animation Highlight */
        .score-update-positive {
            color: #10b981; /* Emerald 500 */
            transform: scale(1.1);
            text-shadow: 0 0 15px rgba(16, 185, 129, 0.3);
            transition: all 0.2s ease;
        }
        .score-update-negative {
            color: #f43f5e; /* Rose 500 */
            transform: scale(1.1);
            text-shadow: 0 0 15px rgba(244, 63, 94, 0.3);
            transition: all 0.2s ease;
        }

        /* Floating Points Animation */
        @keyframes floatUp {
            0% { opacity: 0; transform: translate(-50%, 0) scale(0.5); }
            20% { opacity: 1; transform: translate(-50%, -20px) scale(1.2); }
            100% { opacity: 0; transform: translate(-50%, -60px) scale(1); }
        }

        .score-float {
            position: absolute;
            top: 0;
            left: 50%;
            font-family: 'Inter', sans-serif;
            font-weight: 900;
            font-size: 2rem;
            pointer-events: none;
            animation: floatUp 1.5s cubic-bezier(0.22, 1, 0.36, 1) forwards;
            z-index: 100;
            white-space: nowrap;
            text-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .disabled-cell {
            background-color: #f1f5f9;
            color: transparent;
            cursor: default;
            box-shadow: none;
            border: 2px dashed #cbd5e1;
        }

        /* Das Grid füllt nun immer 100% der Höhe des Containers */
        .game-grid {
            display: grid;
            gap: 0.5rem; /* Etwas kleinerer Abstand um Platz zu sparen */
            width: 100%;
            height: 100%; 
            max-width: 100%;
            margin: 0 auto;
        }
        
        .grid-cell {
            /* aspect-ratio entfernt, damit sie sich strecken können */
            height: 100%;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            border-radius: 0.75rem;
            position: relative;
            overflow: hidden;
            padding: 0.25rem;
        }
        
        .grid-cell::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.4) 0%, rgba(255,255,255,0) 100%);
            pointer-events: none;
        }
        
        /* MathJax adjustments */
        mjx-container {
            font-size: 110% !important;
        }
    </style>
</head>
<body class="h-screen w-screen flex flex-col text-slate-800 bg-slate-50 overflow-hidden">

    <!-- Sound Effects Placeholder (Invisible) -->
    <audio id="sound-correct" preload="auto"></audio>
    <audio id="sound-wrong" preload="auto"></audio>
    <audio id="sound-win" preload="auto"></audio>

    <!-- App Container -->
    <div id="app" class="flex-grow flex flex-col h-full w-full overflow-hidden">
        <!-- Content will be injected by JavaScript -->
    </div>

    <script>
        // --- KONFIGURATION & STATE ---
        const DEFAULT_PASSWORD = "ESZC!2026"; 
        
        const COLOR_THEMES = [
            { name: 'rose', header: 'bg-rose-500', bg: 'bg-rose-200', text: 'text-rose-900', hover: 'hover:bg-rose-300' },
            { name: 'amber', header: 'bg-amber-500', bg: 'bg-amber-200', text: 'text-amber-900', hover: 'hover:bg-amber-300' },
            { name: 'emerald', header: 'bg-emerald-500', bg: 'bg-emerald-200', text: 'text-emerald-900', hover: 'hover:bg-emerald-300' },
            { name: 'sky', header: 'bg-sky-500', bg: 'bg-sky-200', text: 'text-sky-900', hover: 'hover:bg-sky-300' },
            { name: 'violet', header: 'bg-violet-500', bg: 'bg-violet-200', text: 'text-violet-900', hover: 'hover:bg-violet-300' },
            { name: 'fuchsia', header: 'bg-fuchsia-500', bg: 'bg-fuchsia-200', text: 'text-fuchsia-900', hover: 'hover:bg-fuchsia-300' }
        ];

        function createInitialData(cols = 5, rows = 5) {
            return {
                config: { cols: cols, rows: rows },
                categories: Array(cols).fill("").map((_, i) => `Kategorie ${i+1}`),
                teams: [
                    { name: "Team 1", score: 0 },
                    { name: "Team 2", score: 0 },
                    { name: "Team 3", score: 0 },
                    { name: "Team 4", score: 0 }
                ],
                questions: Array(cols * rows).fill(null).map((_, index) => {
                    const row = Math.floor(index / cols);
                    const col = index % cols;
                    return {
                        id: `q_${row}_${col}`,
                        row: row,
                        col: col,
                        value: (row + 1) * 100,
                        question: "",
                        answer: "",
                        answered: false
                    };
                })
            };
        }

        let state = {
            view: 'menu', // menu, game, editor, instructions
            gameData: createInitialData(),
            currentQuestion: null,
            showAnswer: false,
            editorAuth: false
        };

        // --- SOUND SYSTEM ---
        function playSound(type) {
            // Placeholder
        }

        // --- ANIMATION HELPER ---
        function animateValue(obj, start, end, duration) {
            if (start === end) return;
            let startTimestamp = null;
            const step = (timestamp) => {
                if (!startTimestamp) startTimestamp = timestamp;
                const progress = Math.min((timestamp - startTimestamp) / duration, 1);
                const current = Math.floor(progress * (end - start) + start);
                obj.innerHTML = current;
                if (progress < 1) {
                    window.requestAnimationFrame(step);
                } else {
                    obj.innerHTML = end;
                    setTimeout(() => {
                        obj.classList.remove('score-update-positive', 'score-update-negative');
                    }, 500);
                }
            };
            
            if (end > start) obj.classList.add('score-update-positive');
            else obj.classList.add('score-update-negative');
            
            window.requestAnimationFrame(step);
        }

        // --- HILFSFUNKTIONEN ---

        function getTheme(colIndex) {
            return COLOR_THEMES[colIndex % COLOR_THEMES.length];
        }

        function saveToLocal() {
            localStorage.setItem('jeopardyDataV3', JSON.stringify(state.gameData));
        }

        function loadFromLocal() {
            const stored = localStorage.getItem('jeopardyDataV3');
            if (stored) {
                const parsed = JSON.parse(stored);
                if(!parsed.config) parsed.config = { cols: 5, rows: 5 };
                state.gameData = parsed;
            }
        }

        // Auth handling with callback for custom modal
        function requestAuth(onSuccess) {
            if (state.editorAuth) {
                onSuccess();
            } else {
                renderPasswordModal(onSuccess);
            }
        }

        function resetGameStatus() {
            if(!confirm("Möchtest du wirklich ein neues Spiel starten?")) return;
            state.gameData.questions.forEach(q => q.answered = false);
            state.gameData.teams.forEach(t => t.score = 0);
            saveToLocal();
            render();
        }

        function exportData() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(state.gameData));
            const downloadAnchorNode = document.createElement('a');
            downloadAnchorNode.setAttribute("href", dataStr);
            downloadAnchorNode.setAttribute("download", "jeopardy_daten.json");
            document.body.appendChild(downloadAnchorNode);
            downloadAnchorNode.click();
            downloadAnchorNode.remove();
        }

        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const imported = JSON.parse(e.target.result);
                    if (!imported.config) imported.config = { cols: 5, rows: 5 };
                    state.gameData = imported;
                    saveToLocal();
                    render();
                } catch (err) { alert("Fehler beim Laden."); }
            };
            reader.readAsText(file);
        }

        // --- MATHJAX RENDERING ---
        function renderMath() {
            if (window.MathJax && window.MathJax.typesetPromise) {
                window.MathJax.typesetPromise().catch((err) => console.log('MathJax Error:', err));
            }
        }

        // --- SCORE & DISZIPLIN ---

        function triggerScoreFeedback(teamIdx, amount, oldScore, newScore) {
            const scoreEl = document.getElementById(`score-${teamIdx}`);
            if (!scoreEl) return;

            if (amount > 0) playSound('correct');
            else playSound('wrong');

            animateValue(scoreEl, oldScore, newScore, 1000);

            const floatEl = document.createElement('div');
            floatEl.className = `score-float ${amount > 0 ? 'text-emerald-500' : 'text-rose-500'}`;
            floatEl.innerHTML = `${amount > 0 ? '+' : ''}${amount}`;
            
            scoreEl.parentElement.appendChild(floatEl);
            setTimeout(() => floatEl.remove(), 1500);
        }

        function adjustScore(teamIdx, amount) {
            const oldScore = state.gameData.teams[teamIdx].score;
            state.gameData.teams[teamIdx].score += amount;
            
            saveToLocal();
            render();
            
            triggerScoreFeedback(teamIdx, amount, oldScore, state.gameData.teams[teamIdx].score);
        }

        function awardPoints(teamIdx, points) {
            const oldScore = state.gameData.teams[teamIdx].score;
            state.gameData.teams[teamIdx].score += points;
            
            if (state.currentQuestion) {
                state.currentQuestion.answered = true;
                state.currentQuestion = null;
            }

            saveToLocal();
            render(); 

            setTimeout(() => {
                triggerScoreFeedback(teamIdx, points, oldScore, state.gameData.teams[teamIdx].score);
            }, 250);
        }

        function openManualScoreModal(teamIdx) {
            requestAuth(() => {
                const container = document.getElementById('app');
                const overlay = document.createElement('div');
                overlay.className = "fixed inset-0 modal-overlay z-[60] flex items-center justify-center p-4";
                
                const teamName = state.gameData.teams[teamIdx].name;
                
                overlay.innerHTML = `
                    <div class="bg-white p-6 rounded-2xl shadow-xl w-full max-w-sm text-center border border-slate-200 scale-in">
                        <h3 class="text-xl font-bold text-slate-800 mb-2">Manuelle Anpassung</h3>
                        <p class="text-slate-500 text-sm mb-4">Disziplinarmaßnahme für ${teamName}</p>
                        
                        <div class="grid grid-cols-2 gap-3 mb-4">
                             <button onclick="applyManualScore(${teamIdx}, -50, this)" class="bg-rose-100 text-rose-700 py-2 rounded-lg font-bold hover:bg-rose-200">-50 (Störung)</button>
                             <button onclick="applyManualScore(${teamIdx}, 50, this)" class="bg-emerald-100 text-emerald-700 py-2 rounded-lg font-bold hover:bg-emerald-200">+50 (Bonus)</button>
                             <button onclick="applyManualScore(${teamIdx}, -100, this)" class="bg-rose-100 text-rose-700 py-2 rounded-lg font-bold hover:bg-rose-200">-100</button>
                             <button onclick="applyManualScore(${teamIdx}, 100, this)" class="bg-emerald-100 text-emerald-700 py-2 rounded-lg font-bold hover:bg-emerald-200">+100</button>
                        </div>

                        <div class="flex items-center justify-center gap-2 mb-6">
                            <label class="text-xs font-bold text-slate-400">Frei:</label>
                            <input type="number" id="manualInput" class="border border-slate-300 rounded p-1 w-20 text-center font-bold" placeholder="0">
                            <button onclick="applyCustomInput(${teamIdx})" class="bg-slate-800 text-white px-3 py-1 rounded text-sm font-bold">OK</button>
                        </div>
                        
                        <button id="closeManual" class="w-full py-2 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-lg font-bold">Abbrechen</button>
                    </div>
                `;
                container.appendChild(overlay);

                window.closeModal = () => overlay.remove();
                document.getElementById('closeManual').onclick = window.closeModal;
            });
        }

        window.applyManualScore = (idx, amount) => {
            adjustScore(idx, amount);
            window.closeModal();
        }
        
        window.applyCustomInput = (idx) => {
            const val = parseInt(document.getElementById('manualInput').value);
            if(!isNaN(val)) {
                adjustScore(idx, val);
                window.closeModal();
            }
        }

        // --- LOGIC ---
        
        function resizeGrid(newCols, newRows) {
            const oldCols = state.gameData.config.cols;
            const oldRows = state.gameData.config.rows;
            if (newCols < oldCols || newRows < oldRows) {
                if (!confirm(`Achtung: Verkleinerung löscht äußere Fragen. Fortfahren?`)) {
                    render(); return;
                }
            }
            const newQuestions = [];
            for (let r = 0; r < newRows; r++) {
                for (let c = 0; c < newCols; c++) {
                    const existing = state.gameData.questions.find(q => q.row === r && q.col === c);
                    newQuestions.push(existing ? existing : {
                        id: `q_${r}_${c}`, row: r, col: c, value: (r + 1) * 100, question: "", answer: "", answered: false
                    });
                }
            }
            const newCategories = [];
            for (let c = 0; c < newCols; c++) {
                newCategories.push(c < state.gameData.categories.length ? state.gameData.categories[c] : `Kategorie ${c+1}`);
            }
            state.gameData.config.cols = newCols;
            state.gameData.config.rows = newRows;
            state.gameData.questions = newQuestions;
            state.gameData.categories = newCategories;
            saveToLocal();
            render();
        }

        // --- RENDER FUNKTIONEN ---

        function render() {
            const app = document.getElementById('app');
            app.innerHTML = ''; 

            if (state.view === 'menu') renderMenu(app);
            else if (state.view === 'game') renderGame(app);
            else if (state.view === 'editor') renderEditor(app);
            else if (state.view === 'instructions') renderInstructions(app);
            
            // Trigger MathJax nach Render-Vorgang
            setTimeout(renderMath, 20);
        }

        function renderMenu(container) {
            container.innerHTML = `
                <div class="flex flex-col items-center justify-center h-full bg-slate-50 text-center p-6 bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-white via-slate-100 to-slate-200">
                    <div class="mb-12 transform hover:scale-105 transition duration-500">
                        <h1 class="text-7xl md:text-9xl font-black text-transparent bg-clip-text bg-gradient-to-r from-rose-400 via-amber-400 to-sky-400 mb-2 drop-shadow-sm">JEOPARDY</h1>
                        <div class="h-4 w-full flex gap-1 rounded-full overflow-hidden opacity-80">
                            <div class="flex-1 bg-rose-400"></div>
                            <div class="flex-1 bg-amber-400"></div>
                            <div class="flex-1 bg-emerald-400"></div>
                            <div class="flex-1 bg-sky-400"></div>
                            <div class="flex-1 bg-violet-400"></div>
                        </div>
                    </div>
                    
                    <div class="flex flex-col gap-6 w-full max-w-md">
                        <button onclick="state.view='game'; render()" class="flat-btn bg-slate-900 hover:bg-slate-800 text-white font-bold py-5 px-8 rounded-2xl shadow-xl shadow-slate-300 text-xl tracking-wide">
                            SPIEL STARTEN
                        </button>
                        <button onclick="requestAuth(() => { state.view='editor'; render(); })" class="flat-btn bg-white hover:bg-slate-50 text-slate-600 font-bold py-4 px-8 rounded-2xl text-lg border-2 border-slate-200 shadow-sm">
                            EDITOR & EINSTELLUNGEN
                        </button>
                        <button onclick="state.view='instructions'; render()" class="flat-btn bg-slate-100 hover:bg-slate-200 text-slate-500 font-bold py-3 px-8 rounded-2xl text-base border-2 border-slate-200 shadow-sm">
                            ANLEITUNG
                        </button>
                    </div>
                </div>
            `;
        }
        
        function renderPasswordModal(onSuccess) {
            const container = document.getElementById('app');
            const overlay = document.createElement('div');
            overlay.className = "fixed inset-0 modal-overlay z-[70] flex items-center justify-center p-4";
            
            overlay.innerHTML = `
                <div class="bg-white p-8 rounded-3xl shadow-2xl w-full max-w-sm text-center border border-slate-200 scale-in">
                    <h3 class="text-xl font-bold text-slate-800 mb-4">Passwort erforderlich</h3>
                    <input type="password" id="passwordInput" class="w-full p-3 rounded-xl border border-slate-300 text-center text-2xl font-black tracking-widest focus:border-indigo-500 outline-none mb-6" placeholder="****" autofocus>
                    <div class="flex gap-2">
                        <button id="cancelPw" class="flex-1 py-3 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-xl font-bold transition">Abbrechen</button>
                        <button id="confirmPw" class="flex-1 py-3 bg-slate-900 hover:bg-slate-800 text-white rounded-xl font-bold shadow-lg transition">OK</button>
                    </div>
                </div>
            `;
            container.appendChild(overlay);
            
            const input = document.getElementById('passwordInput');
            input.focus();
            
            const checkPw = () => {
                if(input.value === DEFAULT_PASSWORD) {
                    state.editorAuth = true;
                    overlay.remove();
                    onSuccess();
                } else {
                    input.classList.add('border-rose-500', 'bg-rose-50');
                    input.value = '';
                    input.placeholder = "Falsch";
                    setTimeout(() => {
                        input.classList.remove('border-rose-500', 'bg-rose-50');
                        input.placeholder = "****";
                    }, 1000);
                }
            };
            
            document.getElementById('confirmPw').onclick = checkPw;
            document.getElementById('cancelPw').onclick = () => overlay.remove();
            input.onkeydown = (e) => { if(e.key === 'Enter') checkPw(); };
        }

        function renderInstructions(container) {
            container.innerHTML = `
                <div class="flex flex-col h-full bg-slate-50 overflow-hidden">
                    <!-- Header -->
                    <div class="bg-white border-b border-slate-200 p-4 shadow-sm z-30 flex items-center shrink-0">
                        <button onclick="state.view='menu'; render()" class="text-slate-500 hover:text-slate-800 transition font-bold flex items-center gap-2">
                            <span>← ZURÜCK ZUM MENÜ</span>
                        </button>
                    </div>
                    
                    <!-- Content -->
                    <div class="flex-grow overflow-y-auto p-4 md:p-8">
                        <div class="max-w-3xl mx-auto space-y-12 pb-12">
                            
                            <!-- Spielanleitung -->
                            <section class="bg-white p-8 rounded-3xl shadow-sm border border-slate-200">
                                <h2 class="text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-rose-400 to-indigo-500 mb-6">1. Spielanleitung</h2>
                                <div class="space-y-4 text-slate-600 text-lg leading-relaxed">
                                    <p><strong class="text-slate-800">Ziel des Spiels:</strong> Sammelt als Team die meisten Punkte durch richtiges Beantworten von Fragen aus verschiedenen Kategorien.</p>
                                    <ul class="list-disc pl-6 space-y-2">
                                        <li>Das Team mit den meisten Punkten wählt eine <strong class="text-indigo-500">Kategorie</strong> und einen <strong class="text-indigo-500">Punktwert</strong> (z.B. "Mathe für 300").</li>
                                        <li>Die Frage wird aufgedeckt.</li>
                                        <li>Das Team, das die Antwort weiß, meldet sich (oder drückt einen Buzzer).</li>
                                        <li>Ist die Antwort <strong>richtig</strong>, erhält das Team die Punkte.</li>
                                        <li>Ist die Antwort <strong>falsch</strong>, darf ein andere Team raten oder die Frage verfällt.</li>
                                    </ul>
                                </div>
                            </section>

                            <!-- Lehrer Anleitung -->
                            <section class="bg-white p-8 rounded-3xl shadow-sm border border-slate-200">
                                <h2 class="text-3xl font-black text-slate-800 mb-6">2. Anleitung für Lehrer</h2>
                                
                                <div class="space-y-8">
                                    <div>
                                        <h3 class="text-xl font-bold text-slate-700 mb-2 flex items-center gap-2">
                                            <span class="bg-slate-100 p-2 rounded-lg">🛠️</span> Erstellen & Bearbeiten
                                        </h3>
                                        <p class="text-slate-600 ml-11">
                                            Klicke im Menü auf <strong>EDITOR</strong> (Passwort benötigt).<br>
                                            Klicke auf eine beliebige Kachel, um Frage und Antwort einzugeben. 
                                            Nutze oben die Einstellungen für Spalten und Zeilen, um das Spielfeld anzupassen.
                                            <br><span class="text-sm bg-slate-100 px-2 py-1 rounded mt-2 inline-block">Tipp: Formeln mit <strong>&dollar; <i>Formel in LaTeX-Schreibweise</i> &dollar; </strong> einfügen <br> <br>
											Eingabe:  <strong>&dollar; <i>E = mc^2</i> &dollar; </strong> <br>
											Ausgabe:  $E=mc^2$
											</span>
                                        </p>
                                    </div>

                                    <div>
                                        <h3 class="text-xl font-bold text-slate-700 mb-2 flex items-center gap-2">
                                            <span class="bg-slate-100 p-2 rounded-lg">💾</span> Speichern & Laden
                                        </h3>
                                        <p class="text-slate-600 ml-11">
                                            Da dies eine einzelne HTML-Datei ist, werden Daten im Browser gespeichert.<br>
                                            <strong>Wichtig:</strong> Um das Spiel auf einen anderen PC (z.B. Klassenzimmer) zu übertragen, klicke im Editor auf <strong>SPEICHERN</strong>. 
                                            Dies lädt eine <code>.json</code> Datei herunter. Diese kannst du am Ziel-PC über <strong>IMPORT</strong> wieder einladen.
                                        </p>
                                    </div>

                                    <div>
                                        <h3 class="text-xl font-bold text-slate-700 mb-2 flex items-center gap-2">
                                            <span class="bg-slate-100 p-2 rounded-lg">🎓</span> Spiel Durchführen
                                        </h3>
                                        <p class="text-slate-600 ml-11">
                                            Starte das Spiel über das Hauptmenü. Wenn ein Team eine Frage richtig beantwortet, klicke in der Lösungsansicht auf den Namen des Teams. Die Punkte werden automatisch addiert.
                                        </p>
                                    </div>

                                    <div>
                                        <h3 class="text-xl font-bold text-slate-700 mb-2 flex items-center gap-2">
                                            <span class="bg-slate-100 p-2 rounded-lg">⚖️</span> Punkte Korrigieren
                                        </h3>
                                        <p class="text-slate-600 ml-11">
                                            Klicke während des Spiels oben auf den <strong>Punktestand</strong> eines Teams. Nach Eingabe des Passworts kannst du Punkte manuell hinzufügen (Bonus) oder abziehen (Störung).
                                        </p>
                                    </div>
                                </div>
                            </section>

                        </div>
                    </div>
                </div>
            `;
        }

        function renderGame(container) {
            const cols = state.gameData.config.cols;
            const rows = state.gameData.config.rows;
            
            // --- HEADER (Kompakter) ---
            const header = document.createElement('div');
            header.className = "bg-white/95 backdrop-blur-md border-b border-slate-200 shadow-sm flex flex-col shrink-0";
            
            const navBar = document.createElement('div');
            navBar.className = "flex justify-between items-center px-4 py-1.5 border-b border-slate-100";
            navBar.innerHTML = `
                <button onclick="state.view='menu'; render()" class="flex items-center gap-2 text-slate-400 hover:text-slate-800 transition font-bold text-xs md:text-sm">
                    <span>← MENÜ</span>
                </button>
                <div class="font-black text-lg tracking-widest text-slate-800 hidden md:block">JEOPARDY</div>
                <button onclick="resetGameStatus()" class="text-rose-400 hover:text-rose-600 text-[10px] md:text-xs font-bold uppercase tracking-wide border border-rose-200 bg-rose-50 px-2 py-1 rounded-lg">Reset</button>
            `;
            header.appendChild(navBar);

            // Scoreboard Bar
            const scoreBar = document.createElement('div');
            scoreBar.className = "flex justify-around items-center px-2 py-2 gap-2 overflow-x-auto";
            
            state.gameData.teams.forEach((team, idx) => {
                if (!team.name || team.name.trim() === "") return;

                const tDiv = document.createElement('div');
                tDiv.className = "relative flex flex-col items-center min-w-[60px] md:min-w-[80px] group cursor-pointer select-none";
                tDiv.onclick = () => openManualScoreModal(idx);
                tDiv.title = "Klicken für Lehrer-Anpassung";

                tDiv.innerHTML = `
                    <div class="text-slate-400 text-[9px] md:text-[10px] uppercase font-bold tracking-widest mb-0.5 group-hover:text-indigo-500 transition">${team.name}</div>
                    <div id="score-${idx}" class="text-xl md:text-3xl font-black text-slate-800 font-mono leading-none group-hover:text-indigo-600 transition">${team.score}</div>
                    <div class="h-0.5 md:h-1 w-6 md:w-8 bg-slate-200 mt-0.5 rounded group-hover:bg-indigo-200 transition"></div>
                `;
                scoreBar.appendChild(tDiv);
            });
            header.appendChild(scoreBar);
            container.appendChild(header);

            // --- GAME GRID WRAPPER (Full Height, No Scroll) ---
            const gridWrapper = document.createElement('div');
            // 'h-0' with flex-grow forces the child to fit parent, essential for avoiding overflow
            gridWrapper.className = "flex-grow flex flex-col items-center justify-center p-2 bg-slate-50 overflow-hidden h-0 w-full";
            
            const grid = document.createElement('div');
            grid.className = "game-grid";
            // Dynamisches Grid: Kategorien (Zeile 1) und Fragen (Rest) teilen sich die Höhe
            grid.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
            grid.style.gridTemplateRows = `repeat(${rows + 1}, 1fr)`;

            // Kategorien rendern
            state.gameData.categories.forEach((cat, idx) => {
                const theme = getTheme(idx);
                const catEl = document.createElement('div');
                // text-[size-vmin] sorgt für responsive Schriftgröße relativ zur Bildschirmgröße
                catEl.className = `${theme.header} text-white font-bold flex items-center justify-center p-1 text-center uppercase tracking-wider rounded-lg md:rounded-xl shadow-sm break-words overflow-hidden text-[1.8vmin] leading-tight`;
                catEl.innerHTML = `<span>${cat}</span>`;
                grid.appendChild(catEl);
            });

            // Fragen rendern
            state.gameData.questions.forEach(q => {
                const theme = getTheme(q.col);
                const cell = document.createElement('div');
                
                if (q.answered) {
                    cell.className = "grid-cell disabled-cell";
                    cell.textContent = ""; 
                } else {
                    // text-[5vmin] = ~5% der kleineren Bildschirmseite
                    cell.className = `flat-btn grid-cell ${theme.bg} ${theme.text} ${theme.hover} font-black cursor-pointer shadow-sm hover:shadow-md transform hover:scale-[1.02] transition-all duration-200 text-[5vmin]`;
                    cell.textContent = q.value;
                    cell.onclick = () => openQuestionModal(q);
                }
                grid.appendChild(cell);
            });

            gridWrapper.appendChild(grid);
            container.appendChild(gridWrapper);

            if (state.currentQuestion) renderModal(container);
        }

        // --- EDITOR UI ---
        function renderEditor(container) {
            const cols = state.gameData.config.cols;
            const rows = state.gameData.config.rows;

            const header = document.createElement('div');
            header.className = "bg-white border-b border-slate-200 p-4 shadow-sm z-30 sticky top-0";
            header.innerHTML = `
                <div class="flex justify-between items-center mb-4">
                    <button onclick="state.view='menu'; render()" class="text-slate-500 font-bold">← Zurück</button>
                    <div class="flex gap-2">
                        <button onclick="confirmAndClearAll()" class="bg-rose-50 text-rose-600 border border-rose-200 px-3 py-1 rounded-lg text-xs font-bold">Alles leeren</button>
                        <button onclick="exportData()" class="bg-slate-900 text-white px-3 py-1 rounded-lg text-xs font-bold">Speichern</button>
                        <input type="file" id="fIn" class="hidden" onchange="importData(event)"><button onclick="document.getElementById('fIn').click()" class="bg-slate-100 text-slate-600 px-3 py-1 rounded-lg text-xs font-bold">Import</button>
                    </div>
                </div>
                <div class="flex gap-4 justify-center bg-slate-50 p-2 rounded-lg border border-slate-200">
                    <div class="flex items-center gap-2"><span class="text-xs font-bold text-slate-400">SPALTEN:</span>
                    <select id="cSel" class="font-bold bg-transparent outline-none">${[2,3,4,5,6].map(n=>`<option ${n===cols?'selected':''}>${n}</option>`).join('')}</select></div>
                    <div class="flex items-center gap-2"><span class="text-xs font-bold text-slate-400">ZEILEN:</span>
                    <select id="rSel" class="font-bold bg-transparent outline-none">${[2,3,4,5,6,7,8].map(n=>`<option ${n===rows?'selected':''}>${n}</option>`).join('')}</select></div>
                </div>
            `;
            container.appendChild(header);
            
            document.getElementById('cSel').onchange = (e) => resizeGrid(parseInt(e.target.value), rows);
            document.getElementById('rSel').onchange = (e) => resizeGrid(cols, parseInt(e.target.value));

            const content = document.createElement('div');
            content.className = "p-6 overflow-auto bg-slate-100 flex-grow flex flex-col items-center gap-6";

            const catGrid = document.createElement('div');
            catGrid.style = `display:grid; grid-template-columns:repeat(${cols},1fr); gap:1rem; width:100%; max-width:1400px`;
            state.gameData.categories.forEach((cat,i) => {
                const inp = document.createElement('input');
                inp.value = cat;
                const th = getTheme(i);
                inp.className = `${th.header} text-white p-3 text-center rounded-xl font-bold shadow placeholder-white/50 border-none outline-none`;
                inp.onchange = e => { state.gameData.categories[i]=e.target.value; saveToLocal(); };
                catGrid.appendChild(inp);
            });
            content.appendChild(catGrid);

            const qGrid = document.createElement('div');
            qGrid.className = "game-grid";
            // Im Editor lassen wir Scrollen zu, da Eingabe Platz braucht
            qGrid.style = `display:grid; grid-template-columns:repeat(${cols}, 1fr); gap:1rem; width:100%; max-width:1400px`;
            
            state.gameData.questions.forEach(q => {
                const d = document.createElement('div');
                const th = getTheme(q.col);
                const has = q.question.length > 0;
                d.className = `grid-cell aspect-video cursor-pointer flex-col p-2 border-2 ${has?`bg-white border-${th.name}-300`:'bg-slate-200 border-slate-300'}`;
                d.innerHTML = `<div class="font-black text-xl ${has?`text-${th.name}-500`:'text-slate-400'}">${q.value}</div>`;
                d.onclick = () => openEditorModal(q);
                qGrid.appendChild(d);
            });
            content.appendChild(qGrid);
            
            const tEdit = document.createElement('div');
            tEdit.className = "w-full max-w-[1400px] bg-white p-4 rounded-xl shadow-sm";
            tEdit.innerHTML = "<div class='text-xs font-bold text-slate-400 mb-2'>TEAM NAMEN (Leere Namen werden im Spiel ausgeblendet):</div><div id='tInputs' class='flex gap-2 flex-wrap'></div>";
            const tC = tEdit.querySelector('#tInputs');
            state.gameData.teams.forEach((t,i) => {
                const inp = document.createElement('input');
                inp.value = t.name;
                inp.className = "bg-slate-50 border border-slate-200 p-2 rounded font-bold text-slate-700";
                inp.onchange = e => { state.gameData.teams[i].name=e.target.value; saveToLocal(); };
                tC.appendChild(inp);
            });
            content.appendChild(tEdit);
            
            container.appendChild(content);
        }

        // --- QUESTION MODAL (Gameplay) ---
        function renderModal(container) {
            const q = state.currentQuestion;
            const theme = getTheme(q.col);
            
            const overlay = document.createElement('div');
            overlay.className = "fixed inset-0 modal-overlay z-50 flex items-center justify-center p-6";
            
            const content = document.createElement('div');
            content.className = "bg-white p-8 md:p-10 rounded-3xl shadow-2xl max-w-5xl w-full text-center border border-slate-100 scale-in flex flex-col gap-4 md:gap-8 min-h-[50vh] max-h-[90vh] overflow-y-auto justify-center relative";
            content.innerHTML = `<div class="absolute top-0 left-0 w-full h-3 ${theme.header}"></div>`;

            if (!state.showAnswer) {
                content.innerHTML += `
                    <div class="${theme.text} font-bold text-lg md:text-xl uppercase opacity-70">${state.gameData.categories[q.col]} · ${q.value}</div>
                    <div class="flex-grow flex items-center justify-center py-4">
                        <div class="text-slate-800 text-3xl md:text-6xl font-bold leading-tight max-w-4xl">${q.question || "<span class='text-slate-300 italic'>(Keine Frage hinterlegt)</span>"}</div>
                    </div>
                    <button id="ansBtn" class="mt-auto self-center ${theme.header} hover:brightness-110 text-white font-bold py-3 px-8 md:py-4 md:px-12 rounded-full text-lg md:text-xl shadow-lg transition transform hover:-translate-y-1">ANTWORT ZEIGEN</button>
                `;
            } else {
                content.innerHTML += `
                    <div class="text-slate-400 font-bold text-xs md:text-sm uppercase tracking-widest mb-1">Die Frage war:</div>
                    <div class="text-slate-500 text-lg md:text-2xl italic opacity-80 mb-4">"${q.question || "(Leer)"}"</div>
                    <div class="flex-grow flex items-center justify-center py-4">
                        <div class="${theme.text} text-4xl md:text-7xl font-black">${q.answer || "<span class='text-slate-300'>(Keine Antwort)</span>"}</div>
                    </div>
                    <div class="mt-auto bg-slate-50 p-4 md:p-6 rounded-2xl border border-slate-100">
                        <div class="text-xs text-slate-400 uppercase font-bold tracking-wider mb-2">Punkte an Team:</div>
                        <div class="grid grid-cols-2 md:grid-cols-4 gap-2 md:gap-3">
                            ${state.gameData.teams.map((t, idx) => {
                                if (!t.name || t.name.trim() === "") return ""; 
                                return `
                                <button onclick="awardPoints(${idx}, ${q.value})" class="bg-white hover:bg-slate-100 text-slate-600 border border-slate-200 py-2 px-2 md:py-3 md:px-4 rounded-xl transition font-bold shadow-sm text-sm md:text-base">${t.name}</button>
                            `}).join('')}
                        </div>
                        <div class="mt-4 pt-4 border-t border-slate-200">
                             <button onclick="closeQuestion()" class="text-slate-400 hover:text-slate-600 text-sm font-bold uppercase tracking-wide">Niemand</button>
                        </div>
                    </div>
                `;
            }
            overlay.appendChild(content);
            container.appendChild(overlay);
            
            if(!state.showAnswer) {
                document.getElementById('ansBtn').onclick = () => { state.showAnswer=true; render(); };
            }
        }

        function openQuestionModal(question) {
            if (!question.question) {
                alert("Dieses Feld ist noch leer! Bitte im Editor befüllen.");
                return;
            }
            state.currentQuestion = question;
            state.showAnswer = false;
            render();
        }

        function closeQuestion() {
            state.currentQuestion.answered = true;
            state.currentQuestion = null;
            saveToLocal();
            render();
        }

        // --- EDITOR MODAL (Input) ---
        function openEditorModal(question) {
            const container = document.getElementById('app');
            const overlay = document.createElement('div');
            overlay.className = "fixed inset-0 modal-overlay z-50 flex items-center justify-center p-4";
            const theme = getTheme(question.col);
            
            overlay.innerHTML = `
                <div class="bg-white p-6 md:p-8 rounded-3xl shadow-2xl w-full max-w-2xl text-left border border-slate-100 scale-in">
                    <h3 class="text-xl md:text-2xl font-bold text-slate-800 mb-4 md:mb-6 flex justify-between items-center">
                        <span>Bearbeiten</span><span class="${theme.header} text-white px-3 py-1 rounded-full text-sm">${question.value} Pkt</span>
                    </h3>
                    <textarea id="eQ" class="w-full bg-slate-50 text-slate-800 p-4 rounded-2xl border border-slate-200 mb-4 md:mb-6 h-24 md:h-32 focus:border-${theme.name}-400 outline-none font-medium" placeholder="Frage... (LaTeX mit $$ möglich)">${question.question}</textarea>
                    <textarea id="eA" class="w-full bg-slate-50 text-slate-800 p-4 rounded-2xl border border-slate-200 mb-6 md:mb-8 h-20 md:h-24 focus:border-${theme.name}-400 outline-none font-medium" placeholder="Antwort... (LaTeX mit $$ möglich)">${question.answer}</textarea>
                    <div class="flex justify-end gap-3">
                        <button id="cEd" class="px-6 py-3 border border-slate-200 rounded-xl text-slate-500 font-bold">Abbrechen</button>
                        <button id="sEd" class="px-6 py-3 bg-slate-900 text-white rounded-xl font-bold shadow-lg">Speichern</button>
                    </div>
                </div>
            `;
            container.appendChild(overlay);
            document.getElementById('cEd').onclick = () => overlay.remove();
            document.getElementById('sEd').onclick = () => {
                question.question = document.getElementById('eQ').value;
                question.answer = document.getElementById('eA').value;
                saveToLocal();
                overlay.remove();
                render(); 
            };
        }

        // Startup
        loadFromLocal();
        render();

    </script>
</body>
</html>
