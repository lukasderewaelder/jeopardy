<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modernes Klassenraum Jeopardy</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- MathJax Configuration & Load -->
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: {
                fontCache: 'global'
            }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
            overflow: hidden; /* Wichtig: Kein Scrollen auf Body-Ebene */
            height: 100vh;
            width: 100vw;
        }

        /* Modern Flat Utility Classes */
        .flat-btn {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .flat-btn:active {
            transform: scale(0.96);
        }

        .modal-overlay {
            background-color: rgba(248, 250, 252, 0.95);
            backdrop-filter: blur(8px);
        }

        /* Animation classes */
        .scale-in {
            animation: scaleIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        @keyframes scaleIn {
            from { transform: scale(0.9); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        /* Score Animation Highlight */
        .score-update-positive {
            color: #10b981; /* Emerald 500 */
            transform: scale(1.1);
            text-shadow: 0 0 15px rgba(16, 185, 129, 0.3);
            transition: all 0.2s ease;
        }
        .score-update-negative {
            color: #f43f5e; /* Rose 500 */
            transform: scale(1.1);
            text-shadow: 0 0 15px rgba(244, 63, 94, 0.3);
            transition: all 0.2s ease;
        }

        /* Floating Points Animation */
        @keyframes floatUp {
            0% { opacity: 0; transform: translate(-50%, 0) scale(0.5); }
            20% { opacity: 1; transform: translate(-50%, -20px) scale(1.2); }
            100% { opacity: 0; transform: translate(-50%, -60px) scale(1); }
        }

        .score-float {
            position: absolute;
            top: 0;
            left: 50%;
            font-family: 'Inter', sans-serif;
            font-weight: 900;
            font-size: 2rem;
            pointer-events: none;
            animation: floatUp 1.5s cubic-bezier(0.22, 1, 0.36, 1) forwards;
            z-index: 100;
            white-space: nowrap;
            text-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .disabled-cell {
            background-color: #f1f5f9;
            color: transparent;
            cursor: default;
            box-shadow: none;
            border: 2px dashed #cbd5e1;
        }

        /* Joker Animation */
        @keyframes rainbow { 
            0%{background-position:0% 50%}
            50%{background-position:100% 50%}
            100%{background-position:0% 50%}
        }
        .joker-bg {
            background: linear-gradient(124deg, #ff2400, #e81d1d, #e8b71d, #e3e81d, #1de840, #1ddde8, #2b1de8, #dd00f3, #dd00f3);
            background-size: 1800% 1800%;
            animation: rainbow 6s ease infinite;
            -webkit-background-clip: text;
            background-clip: text; 
            color: transparent;
        }

        /* Das Grid füllt nun immer 100% der Höhe des Containers */
        .game-grid {
            display: grid;
            gap: 0.5rem; /* Etwas kleinerer Abstand um Platz zu sparen */
            width: 100%;
            height: 100%; 
            max-width: 100%;
            margin: 0 auto;
        }
        
        .grid-cell {
            height: 100%;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            border-radius: 0.75rem;
            position: relative;
            overflow: hidden;
            padding: 0.25rem;
        }
        
        .grid-cell::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.4) 0%, rgba(255,255,255,0) 100%);
            pointer-events: none;
        }
        
        /* MathJax adjustments */
        mjx-container {
            font-size: 110% !important;
        }
    </style>
</head>
<body class="h-screen w-screen flex flex-col text-slate-800 bg-slate-50 overflow-hidden">

    <!-- Sound Effects - HIER DATEINAMEN ANPASSEN -->
    <audio id="sound-correct" src="richtig.wav" preload="auto"></audio>
    <audio id="sound-wrong" src="falsch.mp3" preload="auto"></audio>
    <audio id="sound-win" src="gewonnen.mp3" preload="auto"></audio>

    <!-- App Container -->
    <div id="app" class="flex-grow flex flex-col h-full w-full overflow-hidden">
        <!-- Content will be injected by JavaScript -->
    </div>

    <script>
        // --- KONFIGURATION & STATE ---
        const DEFAULT_PASSWORD = "1234"; 
        
        const COLOR_THEMES = [
            { name: 'rose', header: 'bg-rose-500', bg: 'bg-rose-200', text: 'text-rose-900', hover: 'hover:bg-rose-300' },
            { name: 'amber', header: 'bg-amber-500', bg: 'bg-amber-200', text: 'text-amber-900', hover: 'hover:bg-amber-300' },
            { name: 'emerald', header: 'bg-emerald-500', bg: 'bg-emerald-200', text: 'text-emerald-900', hover: 'hover:bg-emerald-300' },
            { name: 'sky', header: 'bg-sky-500', bg: 'bg-sky-200', text: 'text-sky-900', hover: 'hover:bg-sky-300' },
            { name: 'violet', header: 'bg-violet-500', bg: 'bg-violet-200', text: 'text-violet-900', hover: 'hover:bg-violet-300' },
            { name: 'fuchsia', header: 'bg-fuchsia-500', bg: 'bg-fuchsia-200', text: 'text-fuchsia-900', hover: 'hover:bg-fuchsia-300' }
        ];

        // Funktion um 50% / 50% Vorzeichen zu generieren (und zu mischen)
        function generateSecretSigns(count) {
            let signs = [];
            let half = Math.floor(count / 2);
            for(let i=0; i<half; i++) {
                signs.push(1);
                signs.push(-1);
            }
            if (count % 2 !== 0) {
                signs.push(Math.random() > 0.5 ? 1 : -1);
            }
            // Mischen (Fisher-Yates Shuffle)
            for (let i = signs.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [signs[i], signs[j]] = [signs[j], signs[i]];
            }
            return signs;
        }

        function createInitialData(cols = 5, rows = 5) {
            const totalQuestions = cols * rows;
            const secretSigns = generateSecretSigns(totalQuestions);

            return {
                config: { 
                    cols: cols, 
                    rows: rows,
                    allowThreeStrikes: false,
                    deductOnWrong: true // Standardmäßig Minuspunkte
                },
                categories: Array(cols).fill("").map((_, i) => `Kategorie ${i+1}`),
                teams: [
                    { name: "Team 1", score: 0 },
                    { name: "Team 2", score: 0 },
                    { name: "Team 3", score: 0 },
                    { name: "Team 4", score: 0 }
                ],
                questions: Array(totalQuestions).fill(null).map((_, index) => {
                    const row = Math.floor(index / cols);
                    const col = index % cols;
                    return {
                        id: `q_${row}_${col}`,
                        row: row,
                        col: col,
                        value: (row + 1) * 100,
                        question: "",
                        answer: "",
                        isJoker: false,
                        answered: false,
                        wrongCount: 0,
                        secretSign: secretSigns[index] // 50/50 verteilt
                    };
                })
            };
        }

        let state = {
            view: 'menu', 
            gameMode: 'classic', // 'classic' oder 'steal_gift'
            gameData: createInitialData(),
            currentQuestion: null,
            modalStep: 0, // 0: Frage, 1: Bewertung, 2: Lösung, 10/11/12: Steal&Gift Steps
            showAnswer: false,
            editorAuth: false,
            pendingScoreUpdates: [],
            sgActingTeam: -1,
            sgTargetTeam: -1
        };

        // --- SOUND SYSTEM ---
        function playSound(type) {
            let audioId = '';
            if (type === 'correct') audioId = 'sound-correct';
            else if (type === 'wrong') audioId = 'sound-wrong';
            else if (type === 'win') audioId = 'sound-win'; 
            
            const audioEl = document.getElementById(audioId);
            if (audioEl) {
                audioEl.currentTime = 0;
                const playPromise = audioEl.play();
                if (playPromise !== undefined) {
                    playPromise.catch(error => console.log("Audio Fehler:", error));
                }
            }
        }

        // --- ANIMATION HELPER ---
        function animateValue(obj, start, end, duration) {
            if (start === end) return;
            let startTimestamp = null;
            const step = (timestamp) => {
                if (!startTimestamp) startTimestamp = timestamp;
                const progress = Math.min((timestamp - startTimestamp) / duration, 1);
                const current = Math.floor(progress * (end - start) + start);
                obj.innerHTML = current;
                if (progress < 1) window.requestAnimationFrame(step);
                else {
                    obj.innerHTML = end;
                    setTimeout(() => obj.classList.remove('score-update-positive', 'score-update-negative'), 500);
                }
            };
            
            if (end > start) obj.classList.add('score-update-positive');
            else obj.classList.add('score-update-negative');
            
            window.requestAnimationFrame(step);
        }

        // --- HILFSFUNKTIONEN ---
        function getTheme(colIndex) { return COLOR_THEMES[colIndex % COLOR_THEMES.length]; }

        function saveToLocal() { localStorage.setItem('jeopardyDataV3', JSON.stringify(state.gameData)); }

        function loadFromLocal() {
            const stored = localStorage.getItem('jeopardyDataV3');
            if (stored) {
                const parsed = JSON.parse(stored);
                if(!parsed.config) parsed.config = { cols: 5, rows: 5, allowThreeStrikes: false, deductOnWrong: true };
                if(typeof parsed.config.allowThreeStrikes === 'undefined') parsed.config.allowThreeStrikes = false;
                if(typeof parsed.config.deductOnWrong === 'undefined') parsed.config.deductOnWrong = true;
                
                let needsSigns = false;
                parsed.questions.forEach(q => {
                    if (typeof q.isJoker === 'undefined') q.isJoker = false;
                    if (typeof q.wrongCount === 'undefined') q.wrongCount = 0;
                    if (typeof q.secretSign === 'undefined') needsSigns = true;
                });
                
                // Falls ältere Speicherstände keine Vorzeichen hatten, werden sie exakt 50/50 verteilt generiert
                if (needsSigns) {
                    const newSigns = generateSecretSigns(parsed.questions.length);
                    parsed.questions.forEach((q, i) => {
                        if (typeof q.secretSign === 'undefined') q.secretSign = newSigns[i];
                    });
                }

                state.gameData = parsed;
            }
        }

        function requestAuth(onSuccess) {
            if (state.editorAuth) onSuccess();
            else renderPasswordModal(onSuccess);
        }

        function resetGameStatus() {
            if(!confirm("Möchtest du wirklich ein neues Spiel starten?")) return;
            const newSigns = generateSecretSigns(state.gameData.questions.length);
            state.gameData.questions.forEach((q, i) => {
                q.answered = false;
                q.wrongCount = 0; 
                q.secretSign = newSigns[i]; // Neues Spiel = Vorzeichen neu 50/50 durchgemischt
            });
            state.gameData.teams.forEach(t => t.score = 0);
            saveToLocal();
            render();
        }

        function exportData() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(state.gameData));
            const downloadAnchorNode = document.createElement('a');
            downloadAnchorNode.setAttribute("href", dataStr);
            downloadAnchorNode.setAttribute("download", "jeopardy_daten.json");
            document.body.appendChild(downloadAnchorNode);
            downloadAnchorNode.click();
            downloadAnchorNode.remove();
        }

        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const imported = JSON.parse(e.target.result);
                    if (!imported.config) imported.config = { cols: 5, rows: 5, allowThreeStrikes: false, deductOnWrong: true };
                    state.gameData = imported;
                    saveToLocal();
                    render();
                } catch (err) { alert("Fehler beim Laden."); }
            };
            reader.readAsText(file);
        }

        function renderMath() {
            if (window.MathJax && window.MathJax.typesetPromise) {
                window.MathJax.typesetPromise().catch((err) => console.log('MathJax Error:', err));
            }
        }

        function startGame(mode) {
            state.gameMode = mode;
            state.view = 'game';
            render();
        }

        // --- SCORE LOGIC & ANIMATION QUEUE ---
        function animateScoreUpdate(teamIdx, amount, oldScore, newScore) {
            const scoreEl = document.getElementById(`score-${teamIdx}`);
            if (!scoreEl) return;
            animateValue(scoreEl, oldScore, newScore, 1000);
            const floatEl = document.createElement('div');
            floatEl.className = `score-float ${amount > 0 ? 'text-emerald-500' : 'text-rose-500'}`;
            floatEl.innerHTML = `${amount > 0 ? '+' : ''}${amount}`;
            scoreEl.parentElement.appendChild(floatEl);
            setTimeout(() => floatEl.remove(), 1500);
        }

        function processPendingScoreUpdates() {
            state.pendingScoreUpdates.forEach((update, i) => {
                setTimeout(() => {
                    animateScoreUpdate(update.teamIdx, update.amount, update.oldScore, update.newScore);
                }, i * 200);
            });
            state.pendingScoreUpdates = [];
        }

        function adjustScore(teamIdx, amount) {
            const oldScore = state.gameData.teams[teamIdx].score;
            state.gameData.teams[teamIdx].score += amount;
            if (amount > 0) playSound('correct');
            else if (amount < 0) playSound('wrong');
            saveToLocal();
            render(); 
            setTimeout(() => animateScoreUpdate(teamIdx, amount, oldScore, state.gameData.teams[teamIdx].score), 250);
        }

        // Punktevergabe KLASSISCH
        function awardPoints(teamIdx, points) {
            const oldScore = state.gameData.teams[teamIdx].score;
            state.gameData.teams[teamIdx].score += points;
            playSound('correct'); 
            state.pendingScoreUpdates.push({ teamIdx, amount: points, oldScore: oldScore, newScore: state.gameData.teams[teamIdx].score });
            
            if (state.currentQuestion && state.currentQuestion.isJoker) {
                closeQuestion();
                return;
            }
            state.modalStep = 2; // Weiter zur Lösung
            saveToLocal();
            render(); 
        }

        // Falsche Antwort
        function registerWrongAnswer(teamIdx, points) {
            const oldScore = state.gameData.teams[teamIdx].score;
            const deduction = state.gameData.config.deductOnWrong ? points : 0;
            state.gameData.teams[teamIdx].score -= deduction;
            playSound('wrong'); 

            if (deduction > 0) {
                state.pendingScoreUpdates.push({ teamIdx, amount: -deduction, oldScore: oldScore, newScore: state.gameData.teams[teamIdx].score });
            }
            
            if (!state.currentQuestion.wrongCount) state.currentQuestion.wrongCount = 0;
            state.currentQuestion.wrongCount++;
            
            if (!state.gameData.config.allowThreeStrikes || state.currentQuestion.wrongCount >= 3) {
               state.modalStep = 2; 
            }
            saveToLocal();
            render();
        }

        // KLAUEN & SCHENKEN Logik
        function sgSelectActingTeam(idx) {
            state.sgActingTeam = idx;
            state.modalStep = 11;
            render();
        }

        function sgSelectTargetTeam(idx) {
            state.sgTargetTeam = idx;
            state.modalStep = 12;
            render();
        }

        function applySgPointsAndSolution() {
            const q = state.currentQuestion;
            const actualPoints = q.value * q.secretSign;
            const targetIdx = state.sgTargetTeam;
            const oldScore = state.gameData.teams[targetIdx].score;
            
            state.gameData.teams[targetIdx].score += actualPoints;
            
            if (actualPoints > 0) playSound('correct');
            else playSound('wrong');

            state.pendingScoreUpdates.push({
                teamIdx: targetIdx,
                amount: actualPoints,
                oldScore: oldScore,
                newScore: state.gameData.teams[targetIdx].score
            });

            state.modalStep = 2; // Show solution
            saveToLocal();
            render();
        }

        // Lifecycle
        function closeQuestion() {
            state.currentQuestion.answered = true;
            state.currentQuestion = null;
            saveToLocal();
            render();
            setTimeout(processPendingScoreUpdates, 250);
        }

        function pauseQuestion() {
            state.currentQuestion = null;
            saveToLocal();
            render();
            setTimeout(processPendingScoreUpdates, 250);
        }

        // --- UI MODALS ---
        function openManualScoreModal(teamIdx) {
            requestAuth(() => {
                const container = document.getElementById('app');
                const overlay = document.createElement('div');
                overlay.className = "fixed inset-0 modal-overlay z-[60] flex items-center justify-center p-4";
                const teamName = state.gameData.teams[teamIdx].name;
                overlay.innerHTML = `<div class="bg-white p-6 rounded-2xl shadow-xl w-full max-w-sm text-center border border-slate-200 scale-in"><h3 class="text-xl font-bold text-slate-800 mb-2">Manuelle Anpassung</h3><p class="text-slate-500 text-sm mb-4">Disziplinarmaßnahme für ${teamName}</p><div class="grid grid-cols-2 gap-3 mb-4"><button onclick="applyManualScore(${teamIdx}, -50, this)" class="bg-rose-100 text-rose-700 py-2 rounded-lg font-bold hover:bg-rose-200">-50 (Störung)</button><button onclick="applyManualScore(${teamIdx}, 50, this)" class="bg-emerald-100 text-emerald-700 py-2 rounded-lg font-bold hover:bg-emerald-200">+50 (Bonus)</button><button onclick="applyManualScore(${teamIdx}, -100, this)" class="bg-rose-100 text-rose-700 py-2 rounded-lg font-bold hover:bg-rose-200">-100</button><button onclick="applyManualScore(${teamIdx}, 100, this)" class="bg-emerald-100 text-emerald-700 py-2 rounded-lg font-bold hover:bg-emerald-200">+100</button></div><div class="flex items-center justify-center gap-2 mb-6"><label class="text-xs font-bold text-slate-400">Frei:</label><input type="number" id="manualInput" class="border border-slate-300 rounded p-1 w-20 text-center font-bold" placeholder="0"><button onclick="applyCustomInput(${teamIdx})" class="bg-slate-800 text-white px-3 py-1 rounded text-sm font-bold">OK</button></div><button id="closeManual" class="w-full py-2 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-lg font-bold">Abbrechen</button></div>`;
                container.appendChild(overlay);
                window.closeModal = () => overlay.remove();
                document.getElementById('closeManual').onclick = window.closeModal;
            });
        }
        window.applyManualScore = (idx, amount) => { adjustScore(idx, amount); window.closeModal(); }
        window.applyCustomInput = (idx) => { const val = parseInt(document.getElementById('manualInput').value); if(!isNaN(val)) { adjustScore(idx, val); window.closeModal(); } }

        function resizeGrid(newCols, newRows) {
            const oldCols = state.gameData.config.cols;
            const oldRows = state.gameData.config.rows;
            if (newCols < oldCols || newRows < oldRows) { if (!confirm(`Achtung: Verkleinerung löscht äußere Fragen. Fortfahren?`)) { render(); return; } }
            const newQuestions = [];
            for (let r = 0; r < newRows; r++) {
                for (let c = 0; c < newCols; c++) {
                    const existing = state.gameData.questions.find(q => q.row === r && q.col === c);
                    if(existing) newQuestions.push(existing);
                    else newQuestions.push({ id: `q_${r}_${c}`, row: r, col: c, value: (r + 1) * 100, question: "", answer: "", isJoker: false, answered: false, wrongCount: 0 });
                }
            }
            
            // Wenn das Layout geändert wird, werden die Vorzeichen neu in 50/50 verteilt
            const newSigns = generateSecretSigns(newQuestions.length);
            newQuestions.forEach((q, i) => { q.secretSign = newSigns[i]; });

            const newCategories = [];
            for (let c = 0; c < newCols; c++) { newCategories.push(c < state.gameData.categories.length ? state.gameData.categories[c] : `Kategorie ${c+1}`); }
            state.gameData.config.cols = newCols;
            state.gameData.config.rows = newRows;
            state.gameData.questions = newQuestions;
            state.gameData.categories = newCategories;
            saveToLocal();
            render();
        }

        function toggleConfig(key, e) { state.gameData.config[key] = e.target.checked; saveToLocal(); }

        // --- RENDER FUNKTIONEN ---
        function render() {
            const app = document.getElementById('app');
            app.innerHTML = ''; 
            if (state.view === 'menu') renderMenu(app);
            else if (state.view === 'game') renderGame(app);
            else if (state.view === 'editor') renderEditor(app);
            else if (state.view === 'instructions') renderInstructions(app);
            setTimeout(renderMath, 20);
        }

        function renderMenu(container) {
            container.innerHTML = `
                <div class="flex flex-col items-center justify-center h-full bg-slate-50 text-center p-6 bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-white via-slate-100 to-slate-200">
                    <div class="mb-12 transform hover:scale-105 transition duration-500">
                        <h1 class="text-7xl md:text-9xl font-black text-transparent bg-clip-text bg-gradient-to-r from-rose-400 via-amber-400 to-sky-400 mb-2 drop-shadow-sm">JEOPARDY</h1>
                    </div>
                    
                    <div class="flex flex-col md:flex-row gap-4 w-full max-w-2xl justify-center mb-6">
                        <button onclick="startGame('classic')" class="flat-btn bg-slate-900 hover:bg-slate-800 text-white font-bold py-5 px-8 rounded-2xl shadow-xl shadow-slate-300 text-xl tracking-wide flex-1 flex flex-col items-center justify-center gap-2">
                            <span>KLASSISCH</span>
                            <span class="text-xs font-medium text-slate-400">Das normale Jeopardy</span>
                        </button>
                        <button onclick="startGame('steal_gift')" class="flat-btn bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-5 px-8 rounded-2xl shadow-xl shadow-indigo-300 text-xl tracking-wide flex-1 flex flex-col items-center justify-center gap-2">
                            <span>KLAUEN & SCHENKEN</span>
                            <span class="text-xs font-medium text-indigo-300">Der taktische Twist</span>
                        </button>
                    </div>

                    <div class="flex justify-center gap-4 w-full max-w-2xl">
                        <button onclick="requestAuth(() => { state.view='editor'; render(); })" class="flat-btn flex-1 bg-white hover:bg-slate-50 text-slate-600 font-bold py-4 px-8 rounded-2xl text-base border-2 border-slate-200 shadow-sm">EDITOR</button>
                        <button onclick="state.view='instructions'; render()" class="flat-btn flex-1 bg-slate-100 hover:bg-slate-200 text-slate-500 font-bold py-4 px-8 rounded-2xl text-base border-2 border-slate-200 shadow-sm">ANLEITUNG</button>
                    </div>
                </div>
            `;
        }
        
        function renderPasswordModal(onSuccess) {
            const container = document.getElementById('app');
            const overlay = document.createElement('div');
            overlay.className = "fixed inset-0 modal-overlay z-[70] flex items-center justify-center p-4";
            overlay.innerHTML = `<div class="bg-white p-8 rounded-3xl shadow-2xl w-full max-w-sm text-center border border-slate-200 scale-in"><h3 class="text-xl font-bold text-slate-800 mb-4">Passwort erforderlich</h3><input type="password" id="passwordInput" class="w-full p-3 rounded-xl border border-slate-300 text-center text-2xl font-black tracking-widest focus:border-indigo-500 outline-none mb-6" placeholder="****" autofocus><div class="flex gap-2"><button id="cancelPw" class="flex-1 py-3 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-xl font-bold transition">Abbrechen</button><button id="confirmPw" class="flex-1 py-3 bg-slate-900 hover:bg-slate-800 text-white rounded-xl font-bold shadow-lg transition">OK</button></div></div>`;
            container.appendChild(overlay);
            const input = document.getElementById('passwordInput'); input.focus();

        // --- EDITOR UI ---

            content.appendChild(catGrid);

            const qGrid = document.createElement('div');

            state.gameData.questions.forEach(q => {
                const d = document.createElement('div');

        // --- QUESTION MODAL (Gameplay State Machine) ---
        function renderModal(container) {
            const q = state.currentQuestion;
            const theme = getTheme(q.col);
            const allowThreeStrikes = state.gameData.config.allowThreeStrikes;
            
            const overlay = document.createElement('div');
            overlay.className = "fixed inset-0 modal-overlay z-50 flex items-center justify-center p-6";
            
            const content = document.createElement('div');
            content.className = "bg-white p-8 md:p-10 rounded-3xl shadow-2xl max-w-5xl w-full text-center border border-slate-100 scale-in flex flex-col gap-4 min-h-[50vh] max-h-[90vh] overflow-y-auto justify-center relative";
            content.innerHTML = `<div class="absolute top-0 left-0 w-full h-3 ${theme.header}"></div>`;

            // Immer Header & Frage oben anzeigen
            content.innerHTML += `
                <div class="flex flex-col items-center justify-center mb-6 border-b border-slate-100 pb-4">

                </div>

            // JOKER HANDLING
            if (q.isJoker && state.modalStep === 0) {
                content.innerHTML += `
                    <div class="flex-grow flex flex-col items-center justify-center py-4">

                        WEITER
                    </button>
                `;
                overlay.appendChild(content);
                container.appendChild(overlay);
                document.getElementById('jokerProceed').onclick = () => { 
                    if(state.gameMode === 'steal_gift') {
                        state.sgActingTeam = -1; state.modalStep = 11;
                    } else {
                        state.modalStep = 1;
                    }
                    render(); 
                };
                return;
            }

            // --- SCHRITT 0: FRAGE ANZEIGEN ---
            if (state.modalStep === 0) {
                content.innerHTML += `
                    <div class="flex-grow flex items-center justify-center">
                         <!-- Platzhalter, um Layout stabil zu halten -->
                    </div>

                        ANTWORTEN / BEWERTEN
                    </button>
                `;
            } 
            
            // --- SCHRITT 1: PUNKTEVERGABE (Klassisch) oder WER WAR ES (Klauen&Schenken) ---
            else if (state.modalStep === 1 || state.modalStep === 10) {
                let wrongCount = q.wrongCount || 0;
                let strikesHTML = allowThreeStrikes && !q.isJoker ? `<div class="text-xs text-rose-500 font-bold mb-1">Fehlversuche: ${wrongCount}/3</div>` : '';
                
                let titleText = "";
                if(q.isJoker) titleText = "Wer bekommt die Joker-Punkte?";
                else if(state.gameMode === 'steal_gift') titleText = "Wer hat die richtige Antwort gegeben?";
                else titleText = "Punkte vergeben:";

                content.innerHTML += `
                    <div class="text-slate-400 font-bold text-xs md:text-sm uppercase tracking-widest mb-2">${titleText}</div>
                    ${strikesHTML}
                    
                    <div class="mt-auto w-full flex flex-col gap-4">
                        <div class="grid grid-cols-2 md:grid-cols-4 gap-2 md:gap-3">
                            ${state.gameData.teams.map((t, idx) => {
                                if (!t.name || t.name.trim() === "") return ""; 
                                
                                // Joker
                                if (q.isJoker) {
                                    const action = state.gameMode === 'steal_gift' ? `sgSelectTargetTeam(${idx})` : `awardPoints(${idx}, ${q.value})`;
                                    return `<button onclick="${action}" class="bg-yellow-100 hover:bg-yellow-200 text-yellow-800 border border-yellow-300 py-3 rounded-xl transition font-bold shadow-sm">${t.name}</button>`;
                                }

                                // Klauen & Schenken: Nur Auswählen, wer richtig lag
                                if (state.gameMode === 'steal_gift') {
                                    if (allowThreeStrikes) {
                                        return `<div class="flex gap-1"><button onclick="sgSelectActingTeam(${idx})" class="flex-grow bg-white hover:bg-indigo-50 text-slate-600 border border-slate-200 py-2 px-2 md:py-3 md:px-4 rounded-l-xl transition font-bold shadow-sm text-sm md:text-base">${t.name}</button><button onclick="registerWrongAnswer(${idx}, ${q.value})" class="bg-rose-50 hover:bg-rose-100 text-rose-600 border border-rose-200 py-2 px-2 md:py-3 rounded-r-xl transition font-bold shadow-sm" title="Falsch">✕</button></div>`;
                                    } else {
                                        return `<button onclick="sgSelectActingTeam(${idx})" class="bg-white hover:bg-indigo-50 text-slate-600 border border-slate-200 py-2 px-2 md:py-3 md:px-4 rounded-xl transition font-bold shadow-sm text-sm md:text-base">${t.name}</button>`;
                                    }

                                // Klassisch
                                else {
                                    if (allowThreeStrikes) {
                                        return `<div class="flex gap-1"><button onclick="awardPoints(${idx}, ${q.value})" class="flex-grow bg-white hover:bg-emerald-50 text-slate-600 border border-slate-200 py-2 px-2 md:py-3 md:px-4 rounded-l-xl transition font-bold shadow-sm text-sm md:text-base">${t.name}</button><button onclick="registerWrongAnswer(${idx}, ${q.value})" class="bg-rose-50 hover:bg-rose-100 text-rose-600 border border-rose-200 py-2 px-2 md:py-3 rounded-r-xl transition font-bold shadow-sm" title="Falsch">✕</button></div>`;
                                    } else {

            else if (state.modalStep === 12) {
                const targetTeam = state.gameData.teams[state.sgTargetTeam];
                const isPositive = q.secretSign > 0;
                const signChar = isPositive ? '+' : '-';
                const colorClass = isPositive ? 'text-emerald-500' : 'text-rose-500';
                
                content.innerHTML += `

                    </div>

                    </button>
                `;
            }

            overlay.appendChild(content);
            container.appendChild(overlay);
            
            if (state.modalStep === 0 && !q.isJoker) { 
                document.getElementById('toScoringBtn').onclick = () => { 
                    state.modalStep = state.gameMode === 'steal_gift' ? 10 : 1; 
                    render(); 
                }; 
            }
        }

        function openQuestionModal(question) {
            if (!question.question && !question.isJoker) {
                alert("Dieses Feld ist noch leer! Bitte im Editor befüllen.");
                return;
            }
            if(typeof question.wrongCount === 'undefined') question.wrongCount = 0;
            state.currentQuestion = question;
            state.modalStep = 0; 
            render();
        }

        // --- EDITOR MODAL (Input) ---
        function openEditorModal(question) {
            const container = document.getElementById('app');
            const overlay = document.createElement('div');
            overlay.className = "fixed inset-0 modal-overlay z-50 flex items-center justify-center p-4";
            const theme = getTheme(question.col);
            
            overlay.innerHTML = `
                <div class="bg-white p-6 md:p-8 rounded-3xl shadow-2xl w-full max-w-2xl text-left border border-slate-100 scale-in">
                    <h3 class="text-xl md:text-2xl font-bold text-slate-800 mb-4 md:mb-6 flex justify-between items-center">
                        <span>Bearbeiten</span>
                        <div class="flex items-center gap-3">
                            <label class="text-xs font-bold text-yellow-600 flex items-center gap-1 cursor-pointer select-none bg-yellow-50 px-2 py-1 rounded-lg border border-yellow-200">
                                <input type="checkbox" id="eJoker" ${question.isJoker ? 'checked' : ''} class="accent-yellow-500"> Als Joker
                            </label>
                            <span class="${theme.header} text-white px-3 py-1 rounded-full text-sm">${question.value} Pkt</span>
                        </div>
                    </h3>
                    <textarea id="eQ" class="w-full bg-slate-50 text-slate-800 p-4 rounded-2xl border border-slate-200 mb-4 md:mb-6 h-24 md:h-32 focus:border-${theme.name}-400 outline-none font-medium" placeholder="Frage... (LaTeX mit $$ möglich)">${question.question}</textarea>
                    <textarea id="eA" class="w-full bg-slate-50 text-slate-800 p-4 rounded-2xl border border-slate-200 mb-6 md:mb-8 h-20 md:h-24 focus:border-${theme.name}-400 outline-none font-medium" placeholder="Antwort... (LaTeX mit $$ möglich)">${question.answer}</textarea>
                    <div class="flex justify-end gap-3">
                        <button id="cEd" class="px-6 py-3 border border-slate-200 rounded-xl text-slate-500 font-bold">Abbrechen</button>
                        <button id="sEd" class="px-6 py-3 bg-slate-900 text-white rounded-xl font-bold shadow-lg">Speichern</button>
                    </div>
                </div>
            `;
            container.appendChild(overlay);
            document.getElementById('cEd').onclick = () => overlay.remove();
            document.getElementById('sEd').onclick = () => {
                question.question = document.getElementById('eQ').value;
                question.answer = document.getElementById('eA').value;
                question.isJoker = document.getElementById('eJoker').checked;
                saveToLocal();
                overlay.remove();
                render(); 
            };
        }

        // Startup
        loadFromLocal();
        render();

    </script>
</body>
</html>
