<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modernes Klassenraum Jeopardy</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- MathJax Configuration & Load -->
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
            overflow: hidden; 
            height: 100vh;
            width: 100vw;
        }

        .flat-btn { transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); }
        .flat-btn:active { transform: scale(0.96); }

        .modal-overlay {
            background-color: rgba(248, 250, 252, 0.95);
            backdrop-filter: blur(8px);
        }

        .scale-in { animation: scaleIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }
        @keyframes scaleIn {
            from { transform: scale(0.9); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .score-update-positive {
            color: #10b981; 
            transform: scale(1.1);
            text-shadow: 0 0 15px rgba(16, 185, 129, 0.3);
            transition: all 0.2s ease;
        }
        .score-update-negative {
            color: #f43f5e; 
            transform: scale(1.1);
            text-shadow: 0 0 15px rgba(244, 63, 94, 0.3);
            transition: all 0.2s ease;
        }

        @keyframes floatUp {
            0% { opacity: 0; transform: translate(-50%, 0) scale(0.5); }
            20% { opacity: 1; transform: translate(-50%, -20px) scale(1.2); }
            100% { opacity: 0; transform: translate(-50%, -60px) scale(1); }
        }

        .score-float {
            position: absolute;
            top: 0; left: 50%;
            font-family: 'Inter', sans-serif;
            font-weight: 900;
            font-size: 2rem;
            pointer-events: none;
            animation: floatUp 1.5s cubic-bezier(0.22, 1, 0.36, 1) forwards;
            z-index: 100;
            white-space: nowrap;
            text-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .disabled-cell {
            background-color: #f1f5f9;
            color: transparent;
            cursor: default;
            box-shadow: none;
            border: 2px dashed #cbd5e1;
        }

        @keyframes rainbow { 
            0%{background-position:0% 50%}
            50%{background-position:100% 50%}
            100%{background-position:0% 50%}
        }
        .joker-bg {
            background: linear-gradient(124deg, #ff2400, #e81d1d, #e8b71d, #e3e81d, #1de840, #1ddde8, #2b1de8, #dd00f3, #dd00f3);
            background-size: 1800% 1800%;
            animation: rainbow 6s ease infinite;
            -webkit-background-clip: text;
            background-clip: text; 
            color: transparent;
        }

        .game-grid {
            display: grid;
            gap: 0.5rem; 
            width: 100%;
            height: 100%; 
            max-width: 100%;
            margin: 0 auto;
        }
        
        .grid-cell {
            height: 100%;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            border-radius: 0.75rem;
            position: relative;
            overflow: hidden;
            padding: 0.25rem;
        }
        
        .grid-cell::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.4) 0%, rgba(255,255,255,0) 100%);
            pointer-events: none;
        }
        
        mjx-container { font-size: 110% !important; }
    </style>
</head>
<body class="h-screen w-screen flex flex-col text-slate-800 bg-slate-50 overflow-hidden">

    <!-- Sound Effects -->
    <audio id="sound-correct" src="richtig.wav" preload="auto"></audio>
    <audio id="sound-wrong" src="falsch.mp3" preload="auto"></audio>
    <audio id="sound-win" src="gewonnen.mp3" preload="auto"></audio>

    <div id="app" class="flex-grow flex flex-col h-full w-full overflow-hidden"></div>

    <script>
        // --- KONFIGURATION & STATE ---
        const DEFAULT_PASSWORD = "1234"; 
        
        const COLOR_THEMES = [
            { name: 'rose', header: 'bg-rose-500', bg: 'bg-rose-200', text: 'text-rose-900', hover: 'hover:bg-rose-300' },
            { name: 'amber', header: 'bg-amber-500', bg: 'bg-amber-200', text: 'text-amber-900', hover: 'hover:bg-amber-300' },
            { name: 'emerald', header: 'bg-emerald-500', bg: 'bg-emerald-200', text: 'text-emerald-900', hover: 'hover:bg-emerald-300' },
            { name: 'sky', header: 'bg-sky-500', bg: 'bg-sky-200', text: 'text-sky-900', hover: 'hover:bg-sky-300' },
            { name: 'violet', header: 'bg-violet-500', bg: 'bg-violet-200', text: 'text-violet-900', hover: 'hover:bg-violet-300' },
            { name: 'fuchsia', header: 'bg-fuchsia-500', bg: 'bg-fuchsia-200', text: 'text-fuchsia-900', hover: 'hover:bg-fuchsia-300' }
        ];

        function generateSecretSigns(count) {
            let signs = [];
            let half = Math.floor(count / 2);
            for(let i=0; i<half; i++) {
                signs.push(1);
                signs.push(-1);
            }
            if (count % 2 !== 0) signs.push(Math.random() > 0.5 ? 1 : -1);
            
            for (let i = signs.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [signs[i], signs[j]] = [signs[j], signs[i]];
            }
            return signs;
        }

        function createInitialData(cols = 5, rows = 5) {
            const totalQuestions = cols * rows;
            const secretSigns = generateSecretSigns(totalQuestions);

            return {
                config: { 
                    cols: cols, 
                    rows: rows,
                    allowThreeStrikes: false,
                    deductOnWrong: true, 
                    enforceOrder: false
                },
                categories: Array(cols).fill("").map((_, i) => `Kategorie ${i+1}`),
                teams: [
                    { name: "Team 1", score: 0 },
                    { name: "Team 2", score: 0 },
                    { name: "Team 3", score: 0 },
                    { name: "Team 4", score: 0 }
                ],
                questions: Array(totalQuestions).fill(null).map((_, index) => {
                    const row = Math.floor(index / cols);
                    const col = index % cols;
                    return {
                        id: `q_${row}_${col}`, row: row, col: col, value: (row + 1) * 100,
                        question: "", answer: "", isJoker: false, answered: false, wrongCount: 0,
                        secretSign: secretSigns[index] 
                    };
                })
            };
        }

        let state = {
            view: 'menu', 
            gameMode: 'classic', // 'classic' oder 'bait_bless'
            gameData: createInitialData(),
            currentQuestion: null,
            modalStep: 0, // 0: Frage, 1: Bewertung, 2: Lösung, 13: Punkteanzeige, 11/12: Bait or Bless
            showAnswer: false,
            editorAuth: false,
            pendingScoreUpdates: [],
            pendingOutcome: null,
            sgActingTeam: -1,
            sgTargetTeam: -1,
            activeTeamIndex: -1,
            isDrawingTeam: false
        };

        // --- SOUND SYSTEM ---
        function playSound(type) {
            let audioId = '';
            if (type === 'correct') audioId = 'sound-correct';
            else if (type === 'wrong') audioId = 'sound-wrong';
            else if (type === 'win') audioId = 'sound-win'; 
            
            const audioEl = document.getElementById(audioId);
            if (audioEl) {
                audioEl.currentTime = 0;
                const playPromise = audioEl.play();
                if (playPromise !== undefined) playPromise.catch(e => console.log("Audio:", e));
            }
        }

        // --- ANIMATION HELPER ---
        function animateValue(obj, start, end, duration) {
            if (start === end) return;
            let startTimestamp = null;
            const step = (timestamp) => {
                if (!startTimestamp) startTimestamp = timestamp;
                const progress = Math.min((timestamp - startTimestamp) / duration, 1);
                const current = Math.floor(progress * (end - start) + start);
                obj.innerHTML = current;
                if (progress < 1) window.requestAnimationFrame(step);
                else {
                    obj.innerHTML = end;
                    setTimeout(() => obj.classList.remove('score-update-positive', 'score-update-negative'), 500);
                }
            };
            if (end > start) obj.classList.add('score-update-positive');
            else obj.classList.add('score-update-negative');
            window.requestAnimationFrame(step);
        }

        // --- CORE LOGIC ---
        function getTheme(colIndex) { return COLOR_THEMES[colIndex % COLOR_THEMES.length]; }

        function saveToLocal() { localStorage.setItem('jeopardyDataV3', JSON.stringify(state.gameData)); }

        function loadFromLocal() {
            const stored = localStorage.getItem('jeopardyDataV3');
            if (stored) {
                const parsed = JSON.parse(stored);
                if(!parsed.config) parsed.config = { cols: 5, rows: 5, allowThreeStrikes: false, deductOnWrong: true, enforceOrder: false };
                
                if(typeof parsed.config.allowThreeStrikes === 'undefined') parsed.config.allowThreeStrikes = false;
                if(typeof parsed.config.deductOnWrong === 'undefined') parsed.config.deductOnWrong = true;
                if(typeof parsed.config.enforceOrder === 'undefined') parsed.config.enforceOrder = false;
                
                let needsSigns = false;
                parsed.questions.forEach(q => {
                    if (typeof q.isJoker === 'undefined') q.isJoker = false;
                    if (typeof q.wrongCount === 'undefined') q.wrongCount = 0;
                    if (typeof q.secretSign === 'undefined') needsSigns = true;
                });
                
                if (needsSigns) {
                    const newSigns = generateSecretSigns(parsed.questions.length);
                    parsed.questions.forEach((q, i) => { if (typeof q.secretSign === 'undefined') q.secretSign = newSigns[i]; });
                }

                state.gameData = parsed;
            }
        }

        function renderMath() {
            if (window.MathJax && window.MathJax.typesetPromise) {
                window.MathJax.typesetPromise().catch((err) => console.log('MathJax Error:', err));
            }
        }

        // --- TEAM REIHENFOLGE LOGIK ---
        function getValidTeamsCount() {
            return state.gameData.teams.filter(t => t.name && t.name.trim() !== "").length;
        }

        function nextTeam() {
            if (!state.gameData.config.enforceOrder) return;
            let nextIdx = state.activeTeamIndex + 1;
            const totalTeams = state.gameData.teams.length;
            
            let found = false;
            for(let i=0; i<totalTeams; i++) {
                if (nextIdx >= totalTeams) nextIdx = 0;
                if (state.gameData.teams[nextIdx].name && state.gameData.teams[nextIdx].name.trim() !== "") {
                    found = true;
                    break;
                }
                nextIdx++;
            }
            if (found) {
                state.activeTeamIndex = nextIdx;
                saveToLocal();
            }
        }

        function startTeamDrawAnimation() {
            const validTeamsCount = getValidTeamsCount();
            if (validTeamsCount === 0) return;

            state.isDrawingTeam = true;
            render();

            const drawDuration = 3000; 
            const intervalTime = 100;
            let elapsed = 0;
            let currentHighlight = 0;

            const drawInterval = setInterval(() => {
                do {
                    currentHighlight = (currentHighlight + 1) % state.gameData.teams.length;
                } while (!state.gameData.teams[currentHighlight].name || state.gameData.teams[currentHighlight].name.trim() === "");
                
                const rouletteDisplay = document.getElementById('rouletteDisplay');
                if(rouletteDisplay) rouletteDisplay.textContent = state.gameData.teams[currentHighlight].name;

                elapsed += intervalTime;
                
                if (elapsed >= drawDuration) {
                    clearInterval(drawInterval);
                    let finalTeams = [];
                    state.gameData.teams.forEach((t, i) => { if (t.name && t.name.trim() !== "") finalTeams.push(i); });
                    const winnerIdx = finalTeams[Math.floor(Math.random() * finalTeams.length)];
                    
                    if(rouletteDisplay) {
                        rouletteDisplay.textContent = state.gameData.teams[winnerIdx].name;
                        rouletteDisplay.classList.add('text-indigo-500', 'scale-110');
                        playSound('correct'); 
                    }

                    state.activeTeamIndex = winnerIdx;
                    saveToLocal();

                    setTimeout(() => {
                        state.isDrawingTeam = false;
                        render();
                    }, 2000); 
                }
            }, intervalTime);
        }

        function startGame(mode) {
            state.gameMode = mode;
            state.view = 'game';
            
            const newSigns = generateSecretSigns(state.gameData.questions.length);
            state.gameData.questions.forEach((q, i) => { q.secretSign = newSigns[i]; });
            
            if (state.gameData.config.enforceOrder && state.activeTeamIndex === -1 && getValidTeamsCount() > 0) {
                startTeamDrawAnimation();
            } else {
                render();
            }
        }

        function resetGameStatus() {
            showConfirm("Möchtest du wirklich ein neues Spiel starten?", () => {
                const newSigns = generateSecretSigns(state.gameData.questions.length);
                state.gameData.questions.forEach((q, i) => {
                    q.answered = false;
                    q.wrongCount = 0; 
                    q.secretSign = newSigns[i]; 
                });
                state.gameData.teams.forEach(t => t.score = 0);
                state.activeTeamIndex = -1; // Reset active team
                saveToLocal();
                
                if (state.view === 'game' && state.gameData.config.enforceOrder && getValidTeamsCount() > 0) {
                    startTeamDrawAnimation();
                } else {
                    render();
                }
            });
        }

        // --- SCORE LOGIC & ANIMATION QUEUE ---
        function animateScoreUpdate(teamIdx, amount, oldScore, newScore) {
            const scoreEl = document.getElementById(`score-${teamIdx}`);
            if (!scoreEl) return;
            animateValue(scoreEl, oldScore, newScore, 1000);
            const floatEl = document.createElement('div');
            floatEl.className = `score-float ${amount > 0 ? 'text-emerald-500' : 'text-rose-500'}`;
            floatEl.innerHTML = `${amount > 0 ? '+' : ''}${amount}`;
            scoreEl.parentElement.appendChild(floatEl);
            setTimeout(() => floatEl.remove(), 1500);
        }

        function processPendingScoreUpdates() {
            state.pendingScoreUpdates.forEach((update, i) => {
                setTimeout(() => { animateScoreUpdate(update.teamIdx, update.amount, update.oldScore, update.newScore); }, i * 200);
            });
            state.pendingScoreUpdates = [];
        }

        function adjustScore(teamIdx, amount) {
            const oldScore = state.gameData.teams[teamIdx].score;
            state.gameData.teams[teamIdx].score += amount;
            if (amount > 0) playSound('correct');
            else if (amount < 0) playSound('wrong');
            saveToLocal();
            render(); 
            setTimeout(() => animateScoreUpdate(teamIdx, amount, oldScore, state.gameData.teams[teamIdx].score), 250);
        }

        // Punktevergabe KLASSISCH
        function awardPoints(teamIdx, points) {
            const oldScore = state.gameData.teams[teamIdx].score;
            state.gameData.teams[teamIdx].score += points;
            playSound('correct'); 
            state.pendingScoreUpdates.push({ teamIdx, amount: points, oldScore: oldScore, newScore: state.gameData.teams[teamIdx].score });
            
            closeQuestion();
        }

        // Falsche Antwort
        function registerWrongAnswer(teamIdx, points) {
            const oldScore = state.gameData.teams[teamIdx].score;
            const deduction = state.gameData.config.deductOnWrong ? points : 0;
            state.gameData.teams[teamIdx].score -= deduction;
            playSound('wrong'); 

            if (deduction > 0) {
                state.pendingScoreUpdates.push({ teamIdx, amount: -deduction, oldScore: oldScore, newScore: state.gameData.teams[teamIdx].score });
            }
            
            if (!state.currentQuestion.wrongCount) state.currentQuestion.wrongCount = 0;
            state.currentQuestion.wrongCount++;
            
            // Wenn enforceOrder AN ist, behandeln wir falsche Antworten immer als Strike
            const isEnforceOrder = state.gameData.config.enforceOrder;
            const allowStrikes = state.gameData.config.allowThreeStrikes;
            
            if ((!allowStrikes && !isEnforceOrder) || state.currentQuestion.wrongCount >= 3) {
               closeQuestion();
            } else {
               saveToLocal();
               render();
            }
        }

        // BAIT OR BLESS Logik
        function sgSelectActingTeam(idx) {
            state.sgActingTeam = idx;
            if (state.currentQuestion && !state.currentQuestion.isJoker) {
                state.pendingOutcome = { mode: 'sg-target', teamIdx: idx, amount: 0, result: 'correct' };
                state.modalStep = 2;
            } else {
                state.modalStep = 11;
            }
            render();
        }

        function sgSelectTargetTeam(idx) {
            state.sgTargetTeam = idx;
            state.modalStep = 12;
            render();
        }

        function applySgPointsAndSolution() {
            const q = state.currentQuestion;
            const actualPoints = q.value * q.secretSign;
            const targetIdx = state.sgTargetTeam;
            const oldScore = state.gameData.teams[targetIdx].score;
            
            state.gameData.teams[targetIdx].score += actualPoints;
            
            if (actualPoints > 0) playSound('correct');
            else playSound('wrong');

            state.pendingScoreUpdates.push({ teamIdx: targetIdx, amount: actualPoints, oldScore: oldScore, newScore: state.gameData.teams[targetIdx].score });
            state.pendingOutcome = null;

            closeQuestion();
        }


        function prepareScoreOutcome(teamIdx, amount, resultLabel) {
            state.pendingOutcome = {
                mode: 'score',
                teamIdx: typeof teamIdx === 'number' ? teamIdx : -1,
                amount: amount || 0,
                result: resultLabel || 'none'
            };
            state.modalStep = 2;
            saveToLocal();
            render();
        }

        function selectCorrectAnswer(teamIdx) {
            const q = state.currentQuestion;
            if (!q) return;

            if (state.gameMode === 'steal_gift') {
                state.sgActingTeam = teamIdx;
                state.pendingOutcome = { mode: 'sg-target', teamIdx, amount: 0, result: 'correct' };
                state.modalStep = 2;
                render();
                return;
            }

            prepareScoreOutcome(teamIdx, q.value, 'correct');
        }

        function selectWrongAnswer(teamIdx) {
            const q = state.currentQuestion;
            if (!q) return;

            const isEnforceOrder = state.gameData.config.enforceOrder;

            // Bei fester Reihenfolge beendet eine falsche Antwort den aktuellen Zug:
            // Die Frage geht unverändert zurück aufs Spielfeld, wird NICHT als beantwortet
            // markiert und das nächste Team darf eine neue Frage auswählen.
            if (isEnforceOrder) {
                const deduction = state.gameData.config.deductOnWrong ? q.value : 0;
                const oldScore = state.gameData.teams[teamIdx].score;

                if (deduction > 0) {
                    state.gameData.teams[teamIdx].score -= deduction;
                    state.pendingScoreUpdates.push({
                        teamIdx,
                        amount: -deduction,
                        oldScore,
                        newScore: state.gameData.teams[teamIdx].score
                    });
                }

                playSound('wrong');
                q.wrongCount = 0;
                state.currentQuestion = null;
                state.pendingOutcome = null;
                state.sgActingTeam = -1;
                state.sgTargetTeam = -1;
                nextTeam();
                saveToLocal();
                render();
                setTimeout(processPendingScoreUpdates, 250);
                return;
            }

            if (!q.wrongCount) q.wrongCount = 0;
            q.wrongCount++;

            const allowStrikes = state.gameData.config.allowThreeStrikes;
            const isFinalWrong = (!allowStrikes || q.wrongCount >= 3);

            if (!isFinalWrong) {
                saveToLocal();
                render();
                return;
            }

            const deduction = state.gameData.config.deductOnWrong ? q.value : 0;
            prepareScoreOutcome(teamIdx, -deduction, 'wrong');
        }

        function selectNoAnswer() {
            state.pendingOutcome = { mode: 'score', teamIdx: -1, amount: 0, result: 'none' };
            state.modalStep = 2;
            render();
        }

        function continueAfterSolution() {
            if (state.pendingOutcome && state.pendingOutcome.mode === 'sg-target') {
                state.modalStep = 11;
            } else {
                state.modalStep = 13;
            }
            render();
        }

        function confirmPendingScore() {
            const outcome = state.pendingOutcome;
            if (outcome && outcome.mode === 'score' && outcome.teamIdx >= 0) {
                const oldScore = state.gameData.teams[outcome.teamIdx].score;
                const amount = outcome.amount || 0;
                state.gameData.teams[outcome.teamIdx].score += amount;

                if (amount > 0) playSound('correct');
                else if (amount < 0 || outcome.result === 'wrong') playSound('wrong');

                if (amount !== 0) {
                    state.pendingScoreUpdates.push({
                        teamIdx: outcome.teamIdx,
                        amount,
                        oldScore,
                        newScore: state.gameData.teams[outcome.teamIdx].score
                    });
                }
            } else if (outcome && outcome.result === 'none') {
                playSound('wrong');
            }

            state.pendingOutcome = null;
            closeQuestion();
        }

        // Lifecycle
        function closeQuestion() {
            if (state.currentQuestion) state.currentQuestion.answered = true;
            state.currentQuestion = null;
            state.pendingOutcome = null;
            state.sgActingTeam = -1;
            state.sgTargetTeam = -1;
            nextTeam();
            saveToLocal();
            render();
            setTimeout(processPendingScoreUpdates, 250);
        }

        function pauseQuestion() {
            state.currentQuestion = null;
            state.pendingOutcome = null;
            state.sgActingTeam = -1;
            state.sgTargetTeam = -1;
            saveToLocal();
            render();
            setTimeout(processPendingScoreUpdates, 250);
        }

        // --- UI MODALS ---
        function showAlert(message) {
            const container = document.getElementById('app');
            const overlay = document.createElement('div');
            overlay.className = "fixed inset-0 modal-overlay z-[80] flex items-center justify-center p-4";
            overlay.innerHTML = `<div class="bg-white p-6 rounded-2xl shadow-xl w-full max-w-sm text-center border border-slate-200 scale-in"><h3 class="text-xl font-bold text-slate-800 mb-4">Hinweis</h3><p class="text-slate-600 mb-6">${message}</p><button id="alertOkBtn" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl font-bold shadow-lg transition">OK</button></div>`;
            container.appendChild(overlay);
            document.getElementById('alertOkBtn').onclick = () => overlay.remove();
        }

        function showConfirm(message, onConfirm, onCancel = null) {
            const container = document.getElementById('app');
            const overlay = document.createElement('div');
            overlay.className = "fixed inset-0 modal-overlay z-[80] flex items-center justify-center p-4";
            overlay.innerHTML = `<div class="bg-white p-6 rounded-2xl shadow-xl w-full max-w-sm text-center border border-slate-200 scale-in"><h3 class="text-xl font-bold text-slate-800 mb-4">Bitte bestätigen</h3><p class="text-slate-600 mb-6">${message}</p><div class="flex gap-2"><button id="confirmCancelBtn" class="flex-1 py-3 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-xl font-bold transition">Abbrechen</button><button id="confirmOkBtn" class="flex-1 py-3 bg-rose-600 hover:bg-rose-700 text-white rounded-xl font-bold shadow-lg transition">Bestätigen</button></div></div>`;
            container.appendChild(overlay);
            document.getElementById('confirmOkBtn').onclick = () => { overlay.remove(); if (onConfirm) onConfirm(); };
            document.getElementById('confirmCancelBtn').onclick = () => { overlay.remove(); if (onCancel) onCancel(); };
        }

        function renderPasswordModal(onSuccess) {
            const container = document.getElementById('app');
            const overlay = document.createElement('div');
            overlay.className = "fixed inset-0 modal-overlay z-[70] flex items-center justify-center p-4";

        function exportData() {
            try {

                    exportedAt: new Date().toISOString(),
                    gameData: getCleanGameDataForExport()
                };
                const blob = new Blob([JSON.stringify(exportPayload, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                const date = new Date().toISOString().slice(0, 10);
                a.href = url;
                a.download = `jeopardy-spiel-${date}.json`;

        function normalizeImportedGameData(rawData) {
            const imported = rawData && rawData.gameData ? rawData.gameData : rawData;
            if (!imported || typeof imported !== 'object') throw new Error('Keine gültigen Spieldaten.');

            const fallback = createInitialData();
            const cols = Number(imported.config?.cols) || fallback.config.cols;
            const rows = Number(imported.config?.rows) || fallback.config.rows;
            const expectedQuestionCount = cols * rows;

            const normalized = {
                config: {
                    cols,
                    rows,
                    allowThreeStrikes: Boolean(imported.config?.allowThreeStrikes),
                    deductOnWrong: typeof imported.config?.deductOnWrong === 'undefined' ? true : Boolean(imported.config.deductOnWrong),
                    enforceOrder: Boolean(imported.config?.enforceOrder)
                },
                categories: Array.isArray(imported.categories) ? imported.categories.slice(0, cols) : [],
                teams: Array.isArray(imported.teams) ? imported.teams.slice(0, 4) : [],
                questions: []
            };

            while (normalized.categories.length < cols) normalized.categories.push(`Kategorie ${normalized.categories.length + 1}`);
            normalized.categories = normalized.categories.map((cat, i) => String(cat || `Kategorie ${i + 1}`));

            while (normalized.teams.length < 4) normalized.teams.push({ name: `Team ${normalized.teams.length + 1}`, score: 0 });
            normalized.teams = normalized.teams.map((team, i) => ({
                name: String(team?.name || `Team ${i + 1}`),
                score: Number(team?.score) || 0
            }));

            const importedQuestions = Array.isArray(imported.questions) ? imported.questions : [];
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    const existing = importedQuestions.find(q => Number(q?.row) === r && Number(q?.col) === c);
                    normalized.questions.push({
                        id: existing?.id || `q_${r}_${c}`,
                        row: r,
                        col: c,
                        value: (r + 1) * 100,
                        question: String(existing?.question || ''),
                        answer: String(existing?.answer || ''),
                        isJoker: Boolean(existing?.isJoker),
                        answered: Boolean(existing?.answered),
                        wrongCount: Number(existing?.wrongCount) || 0,
                        secretSign: typeof existing?.secretSign === 'number' ? existing.secretSign : 1
                    });
                }
            }

            const newSigns = generateSecretSigns(expectedQuestionCount);
            normalized.questions.forEach((q, i) => {
                if (q.secretSign !== 1 && q.secretSign !== -1) q.secretSign = newSigns[i];
            });

            return normalized;
        }

        function importData(event) {
            const file = event?.target?.files?.[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (loadEvent) => {
                try {
                    const parsed = JSON.parse(loadEvent.target.result);
                    state.gameData = normalizeImportedGameData(parsed);
                    state.currentQuestion = null;
                    state.modalStep = 0;
                    state.activeTeamIndex = -1;
                    saveToLocal();
                    render();
                    showAlert('Das Spiel wurde erfolgreich importiert.');
                } catch (error) {
                    console.error('Import fehlgeschlagen:', error);
                    showAlert('Die Datei konnte nicht importiert werden. Bitte wähle eine gültige Jeopardy-JSON-Datei.');
                } finally {
                    event.target.value = '';
                }
            };
            reader.onerror = () => showAlert('Die Datei konnte nicht gelesen werden.');
            reader.readAsText(file);
        }

        function clearAllDataInternal() {
            state.gameData.questions.forEach(q => { q.question = ""; q.answer = ""; q.answered = false; q.isJoker = false; q.wrongCount = 0; });

        function resizeGrid(newCols, newRows) {
            const oldCols = state.gameData.config.cols;
            const oldRows = state.gameData.config.rows;

            const executeResize = () => {
                const newQuestions = [];
                for (let r = 0; r < newRows; r++) {
                    for (let c = 0; c < newCols; c++) {
                        const existing = state.gameData.questions.find(q => q.row === r && q.col === c);
                        if(existing) newQuestions.push(existing);
                        else newQuestions.push({ id: `q_${r}_${c}`, row: r, col: c, value: (r + 1) * 100, question: "", answer: "", isJoker: false, answered: false, wrongCount: 0 });
                    }
                }
                const newSigns = generateSecretSigns(newQuestions.length);
                newQuestions.forEach((q, i) => { q.secretSign = newSigns[i]; });
                const newCategories = [];
                for (let c = 0; c < newCols; c++) { newCategories.push(c < state.gameData.categories.length ? state.gameData.categories[c] : `Kategorie ${c+1}`); }
                state.gameData.config.cols = newCols;
                state.gameData.config.rows = newRows;
                state.gameData.questions = newQuestions;
                state.gameData.categories = newCategories;
                saveToLocal();
                render();
            };

            if (newCols < oldCols || newRows < oldRows) showConfirm(`Achtung: Verkleinerung löscht äußere Fragen. Fortfahren?`, executeResize, () => render());
            else executeResize();
        }

                grid.appendChild(cell);
            });
            gridWrapper.appendChild(grid);
            container.appendChild(gridWrapper);

            if (state.currentQuestion) renderModal(container);
        }

        // --- EDITOR UI ---
        function renderEditor(container) {
            const cols = state.gameData.config.cols;
            const rows = state.gameData.config.rows;
            const threeStrikes = state.gameData.config.allowThreeStrikes;
            const deductWrong = state.gameData.config.deductOnWrong;
            const enforceOrder = state.gameData.config.enforceOrder;
            
            const header = document.createElement('div');
            header.className = "bg-white border-b border-slate-200 p-4 shadow-sm z-30 sticky top-0";
            header.innerHTML = `
                <div class="flex justify-between items-center mb-4">
                    <button onclick="state.editorAuth=false; state.view='menu'; render()" class="text-slate-500 font-bold">← Zurück</button>
                    <div class="flex gap-2">
                        <button onclick="confirmAndClearAll()" class="bg-rose-50 text-rose-600 border border-rose-200 px-3 py-1 rounded-lg text-xs font-bold">Alles leeren</button>
                        <button onclick="exportData()" class="bg-slate-900 text-white px-3 py-1 rounded-lg text-xs font-bold">Speichern</button>
                        <input type="file" id="fIn" class="hidden" onchange="importData(event)"><button onclick="document.getElementById('fIn').click()" class="bg-slate-100 text-slate-600 px-3 py-1 rounded-lg text-xs font-bold">Import</button>
                    </div>
                </div>
                <div class="flex gap-4 justify-center bg-slate-50 p-2 rounded-lg border border-slate-200 items-center flex-wrap">
                    <div class="flex items-center gap-2"><span class="text-xs font-bold text-slate-400">SPALTEN:</span><select id="cSel" class="font-bold bg-transparent outline-none">${[2,3,4,5,6].map(n=>`<option ${n===cols?'selected':''}>${n}</option>`).join('')}</select></div>
                    <div class="flex items-center gap-2"><span class="text-xs font-bold text-slate-400">ZEILEN:</span><select id="rSel" class="font-bold bg-transparent outline-none">${[2,3,4,5,6,7,8].map(n=>`<option ${n===rows?'selected':''}>${n}</option>`).join('')}</select></div>
                    <div class="w-px h-6 bg-slate-300 mx-2"></div>
                    <label class="flex items-center gap-2 text-xs font-bold text-slate-500 cursor-pointer select-none"><input type="checkbox" id="threeStrikes" ${threeStrikes ? 'checked' : ''} class="w-4 h-4 accent-indigo-600 rounded"> 3 Fehlversuche</label>
                    <label class="flex items-center gap-2 text-xs font-bold text-slate-500 cursor-pointer select-none ml-2"><input type="checkbox" id="deductWrong" ${deductWrong ? 'checked' : ''} class="w-4 h-4 accent-rose-600 rounded"> Minuspunkte</label>
                    <div class="w-px h-6 bg-slate-300 mx-2"></div>
                    <label class="flex items-center gap-2 text-xs font-bold text-slate-500 cursor-pointer select-none"><input type="checkbox" id="enforceOrder" ${enforceOrder ? 'checked' : ''} class="w-4 h-4 accent-emerald-600 rounded"> Reihenfolge festlegen</label>
                </div>
            `;
            container.appendChild(header);
            
            document.getElementById('cSel').onchange = (e) => resizeGrid(parseInt(e.target.value), rows);
            document.getElementById('rSel').onchange = (e) => resizeGrid(cols, parseInt(e.target.value));
            document.getElementById('threeStrikes').onchange = (e) => toggleConfig('allowThreeStrikes', e);
            document.getElementById('deductWrong').onchange = (e) => toggleConfig('deductOnWrong', e);
            document.getElementById('enforceOrder').onchange = (e) => toggleConfig('enforceOrder', e);

            const content = document.createElement('div');
            content.className = "p-6 overflow-auto bg-slate-100 flex-grow flex flex-col items-center gap-6";
            const catGrid = document.createElement('div');
            catGrid.style = `display:grid; grid-template-columns:repeat(${cols},1fr); gap:1rem; width:100%; max-width:1400px`;
            state.gameData.categories.forEach((cat,i) => { const inp = document.createElement('input'); inp.value = cat; const th = getTheme(i); inp.className = `${th.header} text-white p-3 text-center rounded-xl font-bold shadow placeholder-white/50 border-none outline-none`; inp.onchange = e => { state.gameData.categories[i]=e.target.value; saveToLocal(); }; catGrid.appendChild(inp); });
            content.appendChild(catGrid);

            const qGrid = document.createElement('div');
            qGrid.className = "game-grid";
            qGrid.style = `display:grid; grid-template-columns:repeat(${cols}, 1fr); gap:1rem; width:100%; max-width:1400px`;
            state.gameData.questions.forEach(q => {
                const d = document.createElement('div');
                const th = getTheme(q.col);
                const has = q.question.length > 0 || q.isJoker;
                d.className = `grid-cell aspect-video cursor-pointer flex-col p-2 border-2 ${has?`bg-white border-${th.name}-300`:'bg-slate-200 border-slate-300'}`;
                let contentHTML = `<div class="font-black text-xl ${has?`text-${th.name}-500`:'text-slate-400'}">${q.value}</div>`;
                if(q.isJoker) contentHTML += `<div class="text-[10px] font-black bg-yellow-400 text-yellow-900 px-2 py-0.5 rounded-full mt-1 uppercase tracking-wider">Joker</div>`;
                d.innerHTML = contentHTML;
                d.onclick = () => openEditorModal(q);
                qGrid.appendChild(d);
            });
            content.appendChild(qGrid);
            
            const tEdit = document.createElement('div');
            tEdit.className = "w-full max-w-[1400px] bg-white p-4 rounded-xl shadow-sm";
            tEdit.innerHTML = "<div class='text-xs font-bold text-slate-400 mb-2'>TEAM NAMEN:</div><div id='tInputs' class='flex gap-2 flex-wrap'></div>";
            const tC = tEdit.querySelector('#tInputs');
            state.gameData.teams.forEach((t,i) => { const inp = document.createElement('input'); inp.value = t.name; inp.className = "bg-slate-50 border border-slate-200 p-2 rounded font-bold text-slate-700"; inp.onchange = e => { state.gameData.teams[i].name=e.target.value; saveToLocal(); }; tC.appendChild(inp); });
            content.appendChild(tEdit);
            container.appendChild(content);
        }

        // --- QUESTION MODAL (Gameplay State Machine) ---
        function renderModal(container) {
            const q = state.currentQuestion;
            const theme = getTheme(q.col);
            const allowThreeStrikes = state.gameData.config.allowThreeStrikes;
            const enforceOrder = state.gameData.config.enforceOrder;
            const isBaitMode = state.gameMode === 'steal_gift';
            
            const overlay = document.createElement('div');
            overlay.className = "fixed inset-0 modal-overlay z-50 flex items-center justify-center p-6";
            
            const content = document.createElement('div');
            content.className = "bg-white p-8 md:p-10 rounded-3xl shadow-2xl max-w-5xl w-full text-center border border-slate-100 scale-in flex flex-col gap-4 md:gap-8 min-h-[50vh] max-h-[90vh] overflow-y-auto justify-center relative";
            content.innerHTML = `<div class="absolute top-0 left-0 w-full h-3 ${theme.header}"></div>`;

            if (state.modalStep === 0) {
                const closeBtn = document.createElement('button');
                closeBtn.innerHTML = '✕';
                closeBtn.className = "absolute top-4 right-4 text-slate-400 hover:text-slate-600 font-bold text-xl";
                closeBtn.onclick = () => pauseQuestion();
                content.appendChild(closeBtn);
            }

            // JOKER HANDLING bleibt bewusst kurz: Joker haben keine Frage/Lösung.
            if (q.isJoker && state.modalStep === 0) {
                content.innerHTML += `
                    <div class="flex-grow flex flex-col items-center justify-center py-4">
                        <div class="joker-bg text-6xl md:text-9xl font-black mb-4 tracking-tighter">JOKER!</div>
                    </div>
                    <button id="jokerProceed" class="mt-auto self-center bg-yellow-400 hover:bg-yellow-300 text-yellow-900 font-bold py-3 px-8 md:py-4 md:px-12 rounded-full text-lg md:text-xl shadow-lg transition transform hover:-translate-y-1">
                        PUNKTE VERGEBEN
                    </button>
                `;
                overlay.appendChild(content);
                container.appendChild(overlay);
                document.getElementById('jokerProceed').onclick = () => { 
                    if(state.gameMode === 'steal_gift') {
                        state.sgActingTeam = enforceOrder ? state.activeTeamIndex : -1; 
                        state.modalStep = 11; 
                    } else {
                        if(enforceOrder) {
                            awardPoints(state.activeTeamIndex, q.value);
                            return;
                        } else {
                            state.modalStep = 1; 
                        }
                    }
                    render(); 
                };
                return;
            }

            // --- SCHRITT 0: FRAGE ANZEIGEN ---
            if (state.modalStep === 0) {
                content.innerHTML += `
                    <div class="flex flex-col items-center justify-center mb-2 border-b border-slate-100 pb-4">
                        <div class="${theme.text} font-bold text-lg uppercase tracking-widest opacity-70 mb-2">${state.gameData.categories[q.col]} · ${q.value}</div>
                        <div class="text-slate-800 text-2xl md:text-4xl font-bold leading-tight max-w-4xl">${q.question || "<span class='text-slate-300 italic'>(Keine Frage hinterlegt)</span>"}</div>
                    </div>
                    <div class="flex-grow flex items-center justify-center"></div>
                    <button id="toScoringBtn" class="mt-auto self-center ${theme.header} hover:brightness-110 text-white font-bold py-4 px-12 rounded-full text-xl shadow-lg transition transform hover:-translate-y-1">
                        ANTWORT BEWERTEN
                    </button>
                `;
            }
            
            // --- SCHRITT 1: AUSWAHL RICHTIG/FALSCH ---
            else if (state.modalStep === 1 || state.modalStep === 10) {
                let wrongCount = q.wrongCount || 0;
                let strikesHTML = (allowThreeStrikes || enforceOrder) && !q.isJoker ? `<div class="text-xs text-rose-500 font-bold mb-1">Fehlversuche: ${wrongCount}/3</div>` : '';
                let titleText = q.isJoker ? "Wer bekommt die Joker-Punkte?" : "War die Antwort richtig oder falsch?";
                let contentHTML = '';

                if (enforceOrder && !q.isJoker) {
                    const activeTeam = state.gameData.teams[state.activeTeamIndex];
                    contentHTML = `
                        <div class="bg-indigo-50 border border-indigo-200 rounded-2xl p-6 md:p-8 flex flex-col items-center gap-6 w-full max-w-md mx-auto">
                            <div class="text-xl md:text-2xl font-black text-indigo-900">${activeTeam.name} ist am Zug</div>
                            <div class="flex gap-4 w-full">
                                <button onclick="selectWrongAnswer(${state.activeTeamIndex})" class="flex-1 bg-white hover:bg-rose-50 text-rose-600 font-bold py-4 rounded-xl transition text-lg shadow-sm border border-rose-200">
                                    ✕ Falsch
                                </button>
                                <button onclick="selectCorrectAnswer(${state.activeTeamIndex})" class="flex-1 bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-4 rounded-xl transition text-lg shadow-md border border-emerald-600">
                                    ✔️ Richtig
                                </button>
                            </div>
                        </div>
                    `;
                } else {
                    contentHTML = `
                        <div class="grid grid-cols-2 md:grid-cols-4 gap-2 md:gap-3">
                            ${state.gameData.teams.map((t, idx) => {
                                if (!t.name || t.name.trim() === "") return ""; 
                                
                                if (q.isJoker) {
                                    const action = state.gameMode === 'steal_gift' ? `sgSelectTargetTeam(${idx})` : `awardPoints(${idx}, ${q.value})`;
                                    return `<button onclick="${action}" class="bg-yellow-100 hover:bg-yellow-200 text-yellow-800 border border-yellow-300 py-3 rounded-xl transition font-bold shadow-sm">${t.name}</button>`;
                                }

                                return `
                                <div class="flex gap-1">
                                    <button onclick="selectCorrectAnswer(${idx})" class="flex-grow bg-white hover:bg-indigo-50 text-slate-600 border border-slate-200 py-2 px-2 md:py-3 md:px-4 rounded-l-xl transition font-bold shadow-sm text-sm md:text-base">${t.name} richtig</button>
                                    <button onclick="selectWrongAnswer(${idx})" class="bg-rose-50 hover:bg-rose-100 text-rose-600 border border-rose-200 py-2 px-2 md:py-3 rounded-r-xl transition font-bold shadow-sm" title="Falsch">✕</button>
                                </div>
                                `;
                            }).join('')}
                        </div>
                    `;
                }

                content.innerHTML += `
                    <div class="text-slate-500 text-xl md:text-2xl font-bold mb-6 italic leading-snug">"${q.question}"</div>
                    <div class="text-slate-400 font-bold text-xs md:text-sm uppercase tracking-widest mb-2">${titleText}</div>
                    ${strikesHTML}
                    <div class="mt-auto w-full flex flex-col gap-4">
                        ${contentHTML}
                        <div class="grid grid-cols-2 gap-3 border-t border-slate-200 pt-4 mt-2">
                             <button onclick="pauseQuestion()" class="bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold py-3 rounded-xl transition text-sm uppercase tracking-wide"> Zurück </button>
                             <button onclick="selectNoAnswer()" class="bg-rose-100 hover:bg-rose-200 text-rose-700 font-bold py-3 rounded-xl transition text-sm uppercase tracking-wide"> Niemand </button>
                        </div>
                    </div>
                `;
            }

            // --- SCHRITT 2: LÖSUNG ANZEIGEN ---
            else if (state.modalStep === 2) {
                const nextLabel = (state.pendingOutcome && state.pendingOutcome.mode === 'sg-target') ? 'WEITER ZUR PUNKTEWAHL' : 'PUNKTE ANZEIGEN';
                content.innerHTML += `
                    <div class="flex flex-col items-center justify-center mb-6 border-b border-slate-100 pb-4">
                        <div class="text-slate-400 font-bold text-xs md:text-sm uppercase tracking-widest mb-1 mt-4">Die Frage war:</div>
                        <div class="text-slate-500 text-lg md:text-2xl italic opacity-80 mb-4">"${q.question || "(Leer)"}"</div>
                    </div>
                    <div class="text-slate-400 font-bold text-xs md:text-sm uppercase tracking-widest mb-1 mt-4">Die richtige Antwort ist:</div>
                    <div class="flex-grow flex items-center justify-center py-4">
                        <div class="${theme.text} text-4xl md:text-6xl font-black">${q.answer || "<span class='text-slate-300'>(Keine Antwort)</span>"}</div>
                    </div>
                    <div class="mt-auto flex flex-col gap-3 w-full max-w-md self-center">
                        <button onclick="continueAfterSolution()" class="w-full ${theme.header} hover:brightness-110 text-white font-bold py-4 rounded-full text-xl shadow-lg transition transform hover:-translate-y-1">
                            ${nextLabel}
                        </button>
                    </div>
                `;
            }

            // --- SCHRITT 11: BAIT OR BLESS ZIELWAHL ---
            else if (state.modalStep === 11) {
                const actingName = state.sgActingTeam >= 0 ? state.gameData.teams[state.sgActingTeam].name : "Das Team";
                const titleText = q.isJoker ? "JOKER! Wem gebt ihr die Punkte?" : `Wem gibt ${actingName} die Punkte?`;

                content.innerHTML += `
                    <div class="text-slate-800 text-2xl md:text-3xl font-black mb-8">${titleText}</div>
                    <div class="mt-auto w-full flex flex-col gap-4">
                        <div class="grid grid-cols-2 md:grid-cols-4 gap-2 md:gap-3">
                            ${state.gameData.teams.map((t, idx) => {
                                if (!t.name || t.name.trim() === "") return ""; 
                                return `<button onclick="sgSelectTargetTeam(${idx})" class="bg-indigo-100 hover:bg-indigo-200 text-indigo-800 border border-indigo-300 py-3 md:py-4 rounded-xl transition font-black shadow-sm text-lg md:text-xl">${t.name}</button>`;
                            }).join('')}
                        </div>
                        <div class="mt-4 pt-4 border-t border-slate-200 flex justify-center">
                             <button onclick="state.modalStep = 2; render()" class="text-slate-500 hover:text-slate-700 font-bold text-sm bg-slate-100 px-4 py-2 rounded border border-slate-200">Zurück zur Lösung</button>
                        </div>
                    </div>
                `;
            }

            // --- SCHRITT 12: BAIT OR BLESS REVEAL / PUNKTEANZEIGE ---
            else if (state.modalStep === 12) {
                const targetTeam = state.gameData.teams[state.sgTargetTeam];
                const isPositive = q.secretSign > 0;
                const signChar = isPositive ? '+' : '-';
                const colorClass = isPositive ? 'text-emerald-500' : 'text-rose-500';
                
                content.innerHTML += `
                    <div class="text-slate-500 text-xl font-bold mb-2 uppercase tracking-widest">Punkteanzeige</div>
                    <div class="flex-grow flex items-center justify-center py-4">
                        <div class="text-[8rem] md:text-[10rem] font-black ${colorClass} scale-in drop-shadow-xl leading-none">
                            ${signChar}${q.value}
                        </div>
                    </div>
                    <div class="text-slate-700 text-2xl font-bold mb-6">
                        ${targetTeam.name} erhält ${signChar}${q.value} Punkte!
                    </div>
                    <div class="mt-auto w-full border-t border-slate-200 pt-6">
                        <button onclick="applySgPointsAndSolution()" class="${isPositive ? 'bg-emerald-500 hover:bg-emerald-600' : 'bg-rose-500 hover:bg-rose-600'} text-white font-bold py-4 px-12 rounded-full text-xl shadow-lg transition transform hover:-translate-y-1">
                            Punkte verbuchen & Schließen
                        </button>
                    </div>
                `;
            }

            // --- SCHRITT 13: KLASSISCHE PUNKTEANZEIGE ---
            else if (state.modalStep === 13) {
                const outcome = state.pendingOutcome || { teamIdx: -1, amount: 0, result: 'none' };
                const hasTeam = outcome.teamIdx >= 0 && state.gameData.teams[outcome.teamIdx];
                const teamName = hasTeam ? state.gameData.teams[outcome.teamIdx].name : 'Kein Team';
                const amount = outcome.amount || 0;
                const amountText = amount > 0 ? `+${amount}` : `${amount}`;
                const colorClass = amount > 0 ? 'text-emerald-500' : (amount < 0 ? 'text-rose-500' : 'text-slate-400');
                const message = hasTeam
                    ? `${teamName} erhält ${amountText} Punkte.`
                    : 'Niemand erhält Punkte.';

                content.innerHTML += `
                    <div class="text-slate-500 text-xl font-bold mb-2 uppercase tracking-widest">Punkteanzeige</div>
                    <div class="flex-grow flex items-center justify-center py-4">
                        <div class="text-[7rem] md:text-[9rem] font-black ${colorClass} scale-in drop-shadow-xl leading-none">${amountText}</div>
                    </div>
                    <div class="text-slate-700 text-2xl font-bold mb-6">${message}</div>
                    <div class="mt-auto w-full border-t border-slate-200 pt-6">
                        <button onclick="confirmPendingScore()" class="${amount >= 0 ? 'bg-emerald-500 hover:bg-emerald-600' : 'bg-rose-500 hover:bg-rose-600'} text-white font-bold py-4 px-12 rounded-full text-xl shadow-lg transition transform hover:-translate-y-1">
                            Punkte verbuchen & Schließen
                        </button>
                    </div>
                `;
            }

            overlay.appendChild(content);
            container.appendChild(overlay);
            
            if (state.modalStep === 0 && !q.isJoker) { 
                document.getElementById('toScoringBtn').onclick = () => { 
                    state.modalStep = 1; 
                    render(); 
                }; 
            }
        }

        function openQuestionModal(question) {
            if (!question.question && !question.isJoker) {
                showAlert("Dieses Feld ist noch leer! Bitte im Editor befüllen.");
                return;
            }
            if(typeof question.wrongCount === 'undefined') question.wrongCount = 0;
            state.currentQuestion = question;
            state.pendingOutcome = null;
            state.sgActingTeam = -1;
            state.sgTargetTeam = -1;
            state.modalStep = 0; 
            render();
        }

        // --- EDITOR MODAL (Input) ---
        function openEditorModal(question) {
            const container = document.getElementById('app');
            const overlay = document.createElement('div');
            overlay.className = "fixed inset-0 modal-overlay z-50 flex items-center justify-center p-4";
            const theme = getTheme(question.col);
            
            overlay.innerHTML = `
                <div class="bg-white p-6 md:p-8 rounded-3xl shadow-2xl w-full max-w-2xl text-left border border-slate-100 scale-in">
                    <h3 class="text-xl md:text-2xl font-bold text-slate-800 mb-4 md:mb-6 flex justify-between items-center">
                        <span>Bearbeiten</span>
                        <div class="flex items-center gap-3">
                            <label class="text-xs font-bold text-yellow-600 flex items-center gap-1 cursor-pointer select-none bg-yellow-50 px-2 py-1 rounded-lg border border-yellow-200">
                                <input type="checkbox" id="eJoker" ${question.isJoker ? 'checked' : ''} class="accent-yellow-500"> Als Joker
                            </label>
                            <span class="${theme.header} text-white px-3 py-1 rounded-full text-sm">${question.value} Pkt</span>
                        </div>
                    </h3>
                    <textarea id="eQ" class="w-full bg-slate-50 text-slate-800 p-4 rounded-2xl border border-slate-200 mb-4 md:mb-6 h-24 md:h-32 focus:border-${theme.name}-400 outline-none font-medium" placeholder="Frage... (LaTeX mit $$ möglich)">${question.question}</textarea>
                    <textarea id="eA" class="w-full bg-slate-50 text-slate-800 p-4 rounded-2xl border border-slate-200 mb-6 md:mb-8 h-20 md:h-24 focus:border-${theme.name}-400 outline-none font-medium" placeholder="Antwort... (LaTeX mit $$ möglich)">${question.answer}</textarea>
                    <div class="flex justify-end gap-3">
                        <button id="cEd" class="px-6 py-3 border border-slate-200 rounded-xl text-slate-500 font-bold">Abbrechen</button>
                        <button id="sEd" class="px-6 py-3 bg-slate-900 text-white rounded-xl font-bold shadow-lg">Speichern</button>
                    </div>
                </div>
            `;
            container.appendChild(overlay);
            document.getElementById('cEd').onclick = () => overlay.remove();
            document.getElementById('sEd').onclick = () => {
                question.question = document.getElementById('eQ').value;
                question.answer = document.getElementById('eA').value;
                question.isJoker = document.getElementById('eJoker').checked;
                saveToLocal();
                overlay.remove();
                render(); 
            };
        }

        // Startup
        loadFromLocal();
        render();

    </script>
</body>
</html>
